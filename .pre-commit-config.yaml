# Pre-commit hooks for Finance Report
# Install: pip install pre-commit && pre-commit install
#
# This prevents common CI failures:
# 1. Ruff lint errors (auto-fixed locally)
# 2. Environment variable sync issues (caught before push)
# 3. Trailing whitespace / merge conflicts
# 4. SSOT/contract/generated-doc drift (caught at push, see pre-push block below)

# Wire both git hook types so `pre-commit install` (run by tools/bootstrap.sh)
# also installs the pre-push hook. `default_stages: [pre-commit]` keeps every
# existing hook commit-only -- adding the pre-push hook type does NOT pull ruff,
# mypy, gitleaks, etc. into `git push`; only hooks that opt in with
# `stages: [pre-push]` run there.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # Ruff - Fast Python linter & formatter (exact local == CI parity via apps/backend/uv.lock)
  - repo: local
    hooks:
      - id: ruff-check
        name: Backend Ruff lint
        entry: bash -c 'cd apps/backend && uv run --frozen ruff check src tests'
        language: system
        files: ^apps/backend/(src|tests)/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: Backend Ruff format check
        entry: bash -c 'cd apps/backend && uv run --frozen ruff format src tests --check'
        language: system
        files: ^apps/backend/(src|tests)/.*\.py$
        pass_filenames: false

  # Content-level secret scan (AC8.13.136). Filename-based .gitignore only stops
  # tracked credential files; this scans staged *content*, so a `git add -f .env`
  # or a pasted key is blocked by what it is, not what it is named. The same scan
  # runs in the CI `lint` job (local==CI parity).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # These three declare push in their upstream stages, so default_stages does
      # not hold them to commit; pin them explicitly. Auto-fixers must not mutate
      # the tree mid-`git push`. Commit behavior is unchanged.
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.snap)$
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: ^(.*\.md|.*\.snap)$
        stages: [pre-commit]
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags in GitHub Actions
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [pre-commit]
      - id: no-commit-to-branch
        args: [--branch, main]

  # Environment manifest and .env.example consistency check
  - repo: local
    hooks:
      - id: env-manifests
        name: Check environment manifests and .env.example
        # Imports config.py / infra2_sdk from the backend lockfile.
        entry: uv run --project apps/backend python -m common.runtime.env_manifests --check
        language: system
        pass_filenames: false
        files: ^(apps/backend/src/config\.py|apps/frontend/required-env\.manifest\.json|common/runtime/env_manifests\.py|runtime-hooks\.manifest\.json|\.env\.example)$
        # Only run when relevant files change

  # Frontend lint (local == CI parity via apps/frontend/package.json)
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend ESLint
        entry: bash -c 'set -e; cd apps/frontend && npm run lint'
        language: system
        files: ^apps/frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Pre-push drift gates (local==CI parity SSOT).
  #
  # Delegates to `python -m common.testing.preflight --tier=static`, which is
  # the single source of truth for fast, diff-aware pre-push checks.
  - repo: local
    hooks:
      - id: preflight-static
        name: Preflight static gates (CI parity SSOT)
        entry: uv run --project apps/backend python -m common.testing.preflight --tier=static
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
