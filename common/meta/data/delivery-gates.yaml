# Delivery Gate Triggers — SSOT
#
# Single source of truth for HOW each delivery CI gate is triggered and WHETHER it
# blocks merge. The behavior contract lives HERE, in one machine-readable place.
#
# Why this file exists: the "in-runner e2e is a synchronous required gate" fact used
# to be restated across ci-cd.md, environments.md, EPIC-008, a workflow comment,
# and a dozen string-grep contract tests. Changing one trigger meant editing 7+ files,
# and a comment reword broke unrelated tests. Now:
#   - this manifest declares the trigger/blocking contract (one edit),
#   - the workflow implements it (one edit),
#   - tests/tooling/test_delivery_gates_contract.py verifies the workflow matches THIS file
#     by parsing `on:`/job structure — not by grepping prose,
#   - ci-cd.md / environments.md / EPIC-008 describe the *behavior* and cross-ref here
#     instead of re-stating the mechanism.
#
# Validated by: tests/tooling/test_delivery_gates_contract.py
# Owner concept in common/meta/data/MANIFEST.yaml: delivery_gate_triggers
#
# trigger values:
#   pull_request      — synchronous PR check (cannot be outrun by a fast/auto merge)
#   workflow_run      — async, after another workflow (e.g. main CI) completes
#   workflow_dispatch — manual / on-demand
#   tag               — on push of a release tag (on.push.tags)

version: "1.0"

gates:
  - id: staging-deploy
    workflow: runtime-hooks.manifest.json
    job: staging_gate
    trigger: workflow_dispatch      # manual/infra2-orchestrated staging gate slot
    blocking: false
    image_free: false
    description: >
      Staging verification hook slot (staging_gate) in runtime-hooks.manifest.json,
      invoked by infra2 after deploying an immutable release image.

  - id: staging-benchmark
    workflow: runtime-hooks.manifest.json
    job: scheduled_audit
    trigger: workflow_call
    blocking: true
    image_free: false
    description: >
      Financial temporal benchmark and scheduled audit slot (scheduled_audit) in
      runtime-hooks.manifest.json.

  - id: release-images
    workflow: runtime-hooks.manifest.json
    job: smoke
    trigger: tag                   # vX.Y.Z release tag push
    blocking: false
    image_free: true              # manifest-copy of existing main-CI :<sha7> images
    description: >
      Promote main-CI SHA images to immutable release tags with digest verification
      and verify deployed runtime health via the smoke hook slot.

  - id: production-release
    workflow: runtime-hooks.manifest.json
    job: prod_gate
    trigger: workflow_dispatch
    blocking: false
    image_free: true              # consumes existing release version_ref images; no rebuild
    description: >
      Deploy an existing staging-validated release version_ref to production via infra2,
      verify deploy liveness via smoke, and run the prod_gate hook slot.
