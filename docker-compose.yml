# Unified Docker Compose Configuration
#
# Controls all 5 environments via Profiles and Environment Variables.
#
# Profiles:
#   - infra: Starts Postgres, MinIO (Local Dev, PR)
#   - app:   Starts Backend, Frontend (PR, Prod, Staging)
#
# Variables:
#   - DB_PORTS: Port mapping for DB (Default: 127.0.0.1:${POSTGRES_PORT:-55432}:5432 for Local)
#   - ENV_SUFFIX: Isolation suffix (Default: empty)

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  postgres:
    image: postgres:15.14-alpine
    container_name: finance-report-db${ENV_SUFFIX:-}
    restart: "${RESTART_POLICY:-unless-stopped}"
    logging: *json-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finance_report}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Local: "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
      # PR: "" (Internal only) or specific binding
      - "${DB_PORTS:-127.0.0.1:${POSTGRES_PORT:-55432}:5432}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    profiles: ["infra"]

  minio:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:4b862594d23cb20ae0fbeb93311ed312a5b566ecba2293220b204c89ef3c1fe2
    container_name: finance-report-minio${ENV_SUFFIX:-}
    restart: "${RESTART_POLICY:-unless-stopped}"
    logging: *json-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORTS:-127.0.0.1:9000:9000}"
      - "${MINIO_CONSOLE_PORTS:-127.0.0.1:9001:9001}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - internal
    profiles: ["infra"]

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:614e083a12c6dc779f13f97e01b13afda4021a8ce3f4021a2fcf23ec86f46837
    container_name: finance-report-minio-init${ENV_SUFFIX:-}
    logging: *json-logging
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      for i in $$(seq 1 10); do
        if mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio_local_secret}; then
          echo 'MinIO alias set.';
          break;
        fi;
        echo 'Retrying...';
        sleep 2;
      done;
      mc mb local/${S3_BUCKET:-statements} --ignore-existing;
      exit 0;
      "
    networks:
      - internal
    profiles: ["infra"]

  backend:
    # Prod: Pulls this image
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-wangzitian0/finance_report}-backend:${SERVICE_VERSION:-latest}
    # PR: Builds this context
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.12-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.9.18}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    container_name: finance-report-backend${ENV_SUFFIX:-}
    restart: "${RESTART_POLICY:-unless-stopped}"
    logging: *json-logging
    # Dependencies depend on profile!
    # Docker Compose handles this: if postgres is not started (profile off), depends_on is ignored or handled gracefully?
    # Actually, if profile is off, the service doesn't exist.
    # We need to be careful here. In Prod (profile=app), postgres (profile=infra) is OFF.
    # So depends_on will FAIL if we are not careful.
    # SOLUTION: We remove explicit depends_on for DB in shared file,
    # OR we assume Prod environment manages startup order differently (it does, via retries).
    # For now, we leave depends_on, but if 'postgres' is disabled, Compose v2 might complain.
    # Let's keep it simple: Backend handles DB connection retries internally.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST:-postgres}:5432/${POSTGRES_DB:-finance_report}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_local_secret}
      S3_BUCKET: ${S3_BUCKET:-statements}
      # Pass-through form (no value): Compose sets this in the container only when
      # the environment it runs with actually has it (shell/direnv, or the root
      # `.env` it loads), and omits the key entirely otherwise.
      LLM_API_KEY:
      # AI provider/endpoint paths and model ids (LLM_LARGE_MODEL / LLM_SMALL_MODEL / LLM_MULTIMODAL_MODEL)
      # are deliberately not pinned here: the infra2 SDK defaults apply (#2566).
      # A duplicate pin here drifted from the code for months (#2005, #2501); the
      # retired AI_MODEL_CATALOG_SOURCE / AI_DAILY_LIMIT_USD knobs are gone too.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      DEBUG: ${DEBUG:-false}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-finance-report-backend}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=development}
      API_RATE_LIMIT_REQUESTS:
      REGISTER_RATE_LIMIT_REQUESTS:
    networks:
      - internal
    profiles: ["app"]

  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-wangzitian0/finance_report}-frontend:${SERVICE_VERSION:-latest}
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20.19.0-alpine}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    container_name: finance-report-frontend${ENV_SUFFIX:-}
    restart: "${RESTART_POLICY:-unless-stopped}"
    logging: *json-logging
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    networks:
      - internal
    profiles: ["app"]

volumes:
  postgres_data:
  minio_data:

networks:
  internal:
    name: finance-report-internal${ENV_SUFFIX:-}
