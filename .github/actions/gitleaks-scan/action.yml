name: 'Gitleaks Secret Scan'
description: 'Install and execute gitleaks scan with sha256 checksum verification'

inputs:
  version:
    description: 'Gitleaks version to download'
    required: false
    default: '8.18.4'
  sha256:
    description: 'Expected sha256 checksum of the gitleaks archive'
    required: false
    default: 'ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d'
  source:
    description: 'Source directory to scan'
    required: false
    default: '.'
  config:
    description: 'Path to gitleaks config file'
    required: false
    default: '.gitleaks.toml'

runs:
  using: 'composite'
  steps:
    - name: Run Gitleaks scan
      shell: bash
      run: |
        set -euo pipefail
        ARCHIVE="/tmp/gitleaks-${{ inputs.version }}.tar.gz"
        curl -sSfL --retry 3 --retry-delay 5 --retry-connrefused -o "$ARCHIVE" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.version }}/gitleaks_${{ inputs.version }}_linux_x64.tar.gz"
        echo "${{ inputs.sha256 }}  ${ARCHIVE}" | sha256sum -c -
        tar -xzf "$ARCHIVE" -C /tmp gitleaks
        rm -f "$ARCHIVE"
        /tmp/gitleaks detect --source "${{ inputs.source }}" --no-git --redact --no-banner \
          --config "${{ inputs.config }}" --exit-code 1
