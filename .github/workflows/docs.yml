name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'common/testing/quality_board.py'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.12"
  UV_VERSION: "0.9.18"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend-env
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build documentation
        run: mkdocs build --clean

      - name: Generate live quality dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INFRA2_TOKEN: ${{ secrets.INFRA2_PAT }}
        run: |
          python -m common.testing.quality_board \
            --output-dir site/board \
            --finance-repo "${{ github.repository }}" \
            --infra2-repo "wangzitian0/infra2"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps['deployment-retry'].outputs.page_url || steps['deployment-retry-2'].outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      # Pages rejects a new deployment while the previous one is still
      # propagating ("Deployment failed, try again later") — burst merges hit
      # this reliably (3-for-3 on 2026-07-06). Two backoff retries absorb it;
      # a genuine outage still fails the run.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before second retry
        if: steps.deployment.outcome == 'failure' && steps['deployment-retry'].outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment-retry-2
        if: steps.deployment.outcome == 'failure' && steps['deployment-retry'].outcome == 'failure'
        uses: actions/deploy-pages@v5
