# PR Test Environment Workflow
#
# On-demand persistent Dokploy PR previews (deploy-preview) and PR-close teardown
# signal (cleanup). The persistent preview is built from the PR source on the
# Dokploy host via workflow_dispatch. When the PR is closed, cleanup dispatches the
# teardown signal to infra2.

name: PR Test Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number'
        required: true
      action:
        description: 'Action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - cleanup

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  DOKPLOY_API_URL: https://cloud.zitian.party/api
  TEST_ENV_ID: -fzh5EGJN74I1AjNEpVUr
  INTERNAL_DOMAIN: zitian.party
  # Local build tags for the source-built preview (never pulled/pushed) + the
  # Dokploy GitHub integration that clones the PR branch for the host build.
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/finance_report
  GITHUB_INTEGRATION_ID: 126refcRlCoWj6pmPXElU

jobs:
  setup:
    name: Setup Variables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      compose_name: ${{ steps.info.outputs.compose_name }}
      pr_number: ${{ steps.info.outputs.pr_number }}
      action: ${{ steps.info.outputs.action }}
      action_reason: ${{ steps.info.outputs.action_reason }}
      head_sha: ${{ steps.info.outputs.head_sha }}
      head_branch: ${{ steps.info.outputs.head_branch }}
      triggering_ci_conclusion: ${{ steps.info.outputs.triggering_ci_conclusion }}
      internal_domain: ${{ steps.info.outputs.internal_domain }}
      preview_app_url: ${{ steps.info.outputs.preview_app_url }}
      preview_commit_slug: ${{ steps.info.outputs.preview_commit_slug }}
      pr_preview_required: ${{ steps.preview_gate.outputs.pr_preview_required }}
      pr_preview_reason: ${{ steps.preview_gate.outputs.pr_preview_reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine params
        id: info
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          from tools._lib.dev.pr_preview_lifecycle import preview_commit_slug

          event_name = os.environ["GITHUB_EVENT_NAME"]
          event_path = os.environ["GITHUB_EVENT_PATH"]
          github_sha = os.environ.get("GITHUB_SHA", "")
          github_ref_name = os.environ.get("GITHUB_REF_NAME", "")
          repository = os.environ["GITHUB_REPOSITORY"]
          internal_domain = os.environ["INTERNAL_DOMAIN"]

          with open(event_path, encoding="utf-8") as fh:
              event = json.load(fh)

          pr_number = ""
          action = "skip"
          action_reason = "unsupported-event"
          head_sha = github_sha
          head_branch = github_ref_name
          triggering_ci_conclusion = ""

          if event_name == "workflow_dispatch":
              inputs = event.get("inputs") or {}
              pr_number = str(inputs.get("pr_number") or "")
              action = str(inputs.get("action") or "deploy")
              action_reason = "manual-dispatch"
          elif event_name == "pull_request":
              pr = event.get("pull_request") or {}
              pr_number = str(pr.get("number") or "")
              head = pr.get("head") or {}
              head_sha = head.get("sha") or head_sha
              head_branch = head.get("ref") or head_branch
              if event.get("action") == "closed":
                  action = "cleanup"
                  action_reason = "pull-request-closed"
              else:
                  # opened/synchronize/reopened: run the in-runner e2e gate
                  # synchronously on this PR commit, so it is a real required check a
                  # fast/auto merge cannot outrun (the old workflow_run path was async
                  # and bypassable). Preview is unaffected — deploy-preview stays
                  # workflow_dispatch-only (P1a-2).
                  action = "deploy"
                  action_reason = "pull-request-sync"

          compose_name = f"pr-{pr_number}" if pr_number else ""
          commit_slug = preview_commit_slug(head_sha or github_sha)
          preview_app_url = (
              f"https://report-pr-{pr_number}.{internal_domain}" if pr_number else ""
          )

          outputs = {
              "internal_domain": internal_domain,
              "pr_number": pr_number,
              "compose_name": compose_name,
              "action": action,
              "action_reason": action_reason,
              "head_sha": head_sha,
              "head_branch": head_branch,
              "triggering_ci_conclusion": triggering_ci_conclusion,
              "preview_commit_slug": commit_slug,
              "preview_app_url": preview_app_url,
          }
          for key, value in outputs.items():
              print(f"{key}={value}")
          PY

      - name: Classify PR preview relevance
        id: preview
        env:
          ACTION: ${{ steps.info.outputs.action }}
          PR_NUMBER: ${{ steps.info.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$ACTION" != "deploy" ]; then
            echo 'env_stage_required={"pr-preview":false}' >> "$GITHUB_OUTPUT"
            echo "env_stage_reasons={\"pr-preview\":\"${ACTION}\"}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'env_stage_required={"pr-preview":true}' >> "$GITHUB_OUTPUT"
            echo 'env_stage_reasons={"pr-preview":"manual-dispatch"}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_state="$(gh pr view "$PR_NUMBER" --json state --jq '.state' 2>/dev/null || echo UNKNOWN)"
          if [ "$pr_state" != "OPEN" ]; then
            echo 'env_stage_required={"pr-preview":false}' >> "$GITHUB_OUTPUT"
            echo "env_stage_reasons={\"pr-preview\":\"pr-not-open-after-ci:${pr_state}\"}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$(git rev-parse "origin/${GITHUB_BASE_REF:-main}" 2>/dev/null || git rev-parse HEAD^ 2>/dev/null || true)"
          if [ -n "$base_sha" ]; then
            git diff --name-only "$base_sha" HEAD > changed-files.txt 2>/dev/null || true
          fi

          if [ ! -s changed-files.txt ]; then
            gh api \
              "/repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
              --paginate \
              --jq '.[].filename' > changed-files.txt || true
          fi

          if [ ! -s changed-files.txt ]; then
            echo 'env_stage_required={"pr-preview":false}' >> "$GITHUB_OUTPUT"
            echo 'env_stage_reasons={"pr-preview":"no-pr-files"}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python tools/ci_change_classifier.py \
            --changed-files changed-files.txt \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Normalize PR preview gate
        id: preview_gate
        env:
          ENV_STAGE_REQUIRED: ${{ steps.preview.outputs.env_stage_required }}
          ENV_STAGE_REASONS: ${{ steps.preview.outputs.env_stage_reasons }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          required = json.loads(os.environ["ENV_STAGE_REQUIRED"])
          reasons = json.loads(os.environ["ENV_STAGE_REASONS"])
          print(f"pr_preview_required={str(required['pr-preview']).lower()}")
          print(f"pr_preview_reason={reasons['pr-preview']}")
          PY

  deploy-preview:
    name: Deploy Persistent Preview
    # On-demand only (P1a-2, #879): a persistent Dokploy preview is NOT created
    # automatically per PR. It runs solely via manual `workflow_dispatch` (one click:
    # Run workflow -> PR number), then builds the
    # PR's source on the Dokploy host and persists until the PR is closed. It never
    # blocks the PR; this job reports the preview URL via PR comment. This app-side
    # persistent PR preview path is not the infra2 deploy_v2 preview/* front door used
    # by report-branch-main/canary slots.
    if: needs.setup.outputs.action == 'deploy' && needs.setup.outputs.pr_preview_required == 'true' && github.event_name == 'workflow_dispatch'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy preview lifecycle (build from source on Dokploy host)
        id: deploy
        continue-on-error: true
        timeout-minutes: 25
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          BRANCH_NAME: ${{ needs.setup.outputs.head_branch }}
          PR_PREVIEW_CONTEXT_PATH: ci-context/pr-preview-deploy-context.json
          PR_PREVIEW_NEW_DEPLOYMENT_TIMEOUT_SECONDS: "600"
        run: |
          python tools/pr_preview_lifecycle.py \
            --action deploy \
            --pr-number "${{ needs.setup.outputs.pr_number }}" \
            --compose-name "${{ needs.setup.outputs.compose_name }}" \
            --environment-id="${{ env.TEST_ENV_ID }}" \
            --api-url "${{ env.DOKPLOY_API_URL }}" \
            --api-key "$DOKPLOY_API_KEY" \
            --github-integration-id "${{ env.GITHUB_INTEGRATION_ID }}" \
            --branch "$BRANCH_NAME" \
            --commit-sha "${{ needs.setup.outputs.head_sha }}" \
            --registry "${{ env.REGISTRY }}" \
            --image-prefix "${{ env.IMAGE_PREFIX }}" \
            --internal-domain "${{ needs.setup.outputs.internal_domain }}"

      - name: Upload preview deploy context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-deploy-context
          path: ci-context/
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment persistent preview URL
        if: always()
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          PREVIEW_URL: ${{ needs.setup.outputs.preview_app_url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEAD_SHA: ${{ needs.setup.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- pr-preview-deploy -->';
            const ok = process.env.DEPLOY_OUTCOME === 'success';
            const url = process.env.PREVIEW_URL;
            const title = ok
              ? 'Persistent Preview Deployed'
              : 'Persistent Preview Deploy Failed (non-blocking)';
            const line = ok
              ? `Preview URL: ${url}`
              : `Deploy outcome: \`${process.env.DEPLOY_OUTCOME || 'skipped'}\` — see [logs](${process.env.RUN_URL}). This is non-blocking; the in-runner E2E gate is the merge authority.`;
            const body = `${marker}
            ## ${title}

            ${line}

            Built from this PR's source on the Dokploy host (no image pull/push). Persists until the PR is closed, then released via \`compose.delete\`.

            - Head SHA: \`${process.env.HEAD_SHA}\`
            - Logs: [workflow run](${process.env.RUN_URL})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body,
              });
            }

  cleanup:
    name: Dispatch preview teardown to infra2
    if: needs.setup.outputs.action == 'cleanup' && needs.setup.outputs.pr_number != ''
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The app does NOT tear its own preview down (it must not touch the Dokploy
      # API — that boundary is infra2's). On PR close it emits a vendor-neutral
      # signal; infra2's preview-teardown.yml performs the authoritative,
      # idempotent 1:1 teardown through the deploy_v2 front door. infra2's hourly
      # preview-leak-check is the detection fallback for a missed signal.
      - name: Dispatch preview teardown to infra2
        env:
          INFRA2_PAT: ${{ secrets.INFRA2_PAT }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ -z "${INFRA2_PAT:-}" ]]; then
            echo "::error::INFRA2_PAT is required to dispatch the preview teardown to infra2."
            exit 1
          fi
          payload="$(jq -nc --arg pr "$PR_NUMBER" \
            '{event_type: "preview-teardown", client_payload: {pr_number: $pr}}')"
          http_status="$(curl -sS -o /tmp/infra2_teardown_resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${INFRA2_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --connect-timeout 10 --max-time 30 \
            https://api.github.com/repos/wangzitian0/infra2/dispatches \
            -d "$payload")"
          echo "infra2 preview-teardown dispatch -> HTTP $http_status (pr=$PR_NUMBER)"
          # GitHub returns 204 No Content on a successful dispatch.
          if [[ "$http_status" != "204" ]]; then
            sed 's/^/  /' /tmp/infra2_teardown_resp 2>/dev/null || true
            echo "::error::infra2 preview-teardown dispatch failed (expected HTTP 204). Check INFRA2_PAT scope/expiry."
            exit 1
          fi

      - name: Write PR preview cleanup context
        if: ${{ always() }}
        run: |
          mkdir -p ci-context
          {
            echo "PR Preview Cleanup Context"
            echo "=========================="
            echo "repository=${{ github.repository }}"
            echo "event_name=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "pr_number=${{ needs.setup.outputs.pr_number }}"
            echo "compose_name=${{ needs.setup.outputs.compose_name }}"
            echo "action_reason=${{ needs.setup.outputs.action_reason }}"
            echo "triggering_ci_conclusion=${{ needs.setup.outputs.triggering_ci_conclusion }}"
            echo "cleanup_action=dispatch-infra2-preview-teardown"
            echo "pr_preview_images=not-created"
          } > ci-context/pr-preview-cleanup-context.txt

      - name: Upload PR preview cleanup context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-cleanup-context
          path: ci-context/pr-preview-cleanup-context.txt
          retention-days: 14
