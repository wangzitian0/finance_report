name: Journey Board

# Core-journey board publisher (#2370, AC-testing.journey-board.6).
#
# Heavy board, light gates. When a Deploy or AI/OCR Audit Replay run completes,
# this workflow turns the staging AI/OCR gate artifact of that run into one
# board record and pushes it to the gh-pages branch under board/. The board
# page (docs/board/index.html) reads board/fragment.html from there.
#
# Two triggers (runtime safety rule): workflow_run publishes each run as it
# completes; an hourly schedule (and a dispatch without run_id) reconciles
# recent runs that have no record, for example when a workflow_run event did
# not fire. A dispatch with run_id publishes that run again.
#
# This workflow blocks nothing. No job needs it and no ruleset requires it.
# The gate workflows stay read-only: only this workflow has contents: write.
# A red run here means the board did not update. It never means a deploy or a
# release failed.

on:
  workflow_run:
    workflows: ["Deploy", "AI/OCR Audit Replay"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID to publish again; empty reconciles recent runs that have no record"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish board record
    # Only runs of this repository. The artifact is parsed as data, never run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
      INPUT_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Check out main for the board tooling
        uses: actions/checkout@v7

      - name: Check out gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - name: Select the runs to publish
        id: select
        run: |
          set -euo pipefail
          if [ -n "${EVENT_RUN_ID}" ]; then
            ids="${EVENT_RUN_ID}"
          elif [ -n "${INPUT_RUN_ID}" ]; then
            ids="${INPUT_RUN_ID}"
          else
            # Reconcile: completed runs of the last 7 days with no record for
            # their attempt (artifacts live 14 days, so they still exist).
            # Image-promotion runs ("Release Images ...") hold no gate.
            since="$(date -u -d '7 days ago' +%Y-%m-%d)"
            ids=""
            for workflow in deploy.yml audit-replay.yml; do
              while read -r id attempt title; do
                [ -n "${id}" ] || continue
                case "${title}" in "Release Images "*) continue ;; esac
                if compgen -G "pages/board/records/*/*-${id}-${attempt}.json" > /dev/null; then
                  continue
                fi
                ids="${ids} ${id}"
              done < <(gh api "repos/${REPO}/actions/workflows/${workflow}/runs?status=completed&per_page=30&created=%3E%3D${since}" \
                --jq '.workflow_runs[] | "\(.id) \(.run_attempt) \(.display_title)"')
            done
          fi
          ids="$(echo "${ids}" | xargs)"
          echo "Runs to publish: ${ids:-none}"
          echo "ids=${ids}" >> "$GITHUB_OUTPUT"

      - name: Build the records
        id: record
        if: steps.select.outputs.ids != ''
        env:
          RUN_IDS: ${{ steps.select.outputs.ids }}
        run: |
          set -uo pipefail
          build_one() {
            set -euo pipefail
            local run_id="$1"
            local input="board-input/${run_id}"
            mkdir -p "${input}/artifact"
            gh api "repos/${REPO}/actions/runs/${run_id}" > "${input}/run.json"
            gh api --paginate "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '.jobs[]' | jq -s '{jobs: .}' > "${input}/jobs.json"
            # A rerun keeps the earlier attempt's artifact under the same name, so
            # pick the artifact of the current attempt by id (no name lookup).
            # "No artifact" is evidence and gives a not-run or no-evidence
            # record; any API or unzip error fails this run's build.
            gh api --paginate "repos/${REPO}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq '.artifacts[]' | jq -s '{artifacts: .}' > "${input}/artifacts.json"
            local artifact_id
            artifact_id=$(python3 -I common/testing/journey_board.py pick-artifact \
              --artifacts-json "${input}/artifacts.json" --run-json "${input}/run.json")
            if [ -n "${artifact_id}" ]; then
              gh api "repos/${REPO}/actions/artifacts/${artifact_id}/zip" > "${input}/artifact.zip"
              unzip -q "${input}/artifact.zip" -d "${input}/artifact"
            else
              echo "::notice::Run ${run_id} has no staging-ai-ocr-test-context artifact for its current attempt."
            fi
            # The tested SHA: from the test context, else from the deployed
            # version (the context version, or "Deploy Staging <version>").
            local resolved_sha="" version=""
            local context
            context=$(find "${input}/artifact" -name staging-ai-ocr-context.txt | head -n 1)
            if [ -n "${context}" ]; then
              resolved_sha=$(sed -n 's/^tested_sha=\([0-9a-f]\{40\}\)$/\1/p' "${context}")
              version=$(sed -n 's/^expected_version=//p' "${context}")
            else
              version=$(jq -r '.display_title' "${input}/run.json" | sed -n 's/^Deploy Staging \(v[0-9][0-9.]*\)$/\1/p')
            fi
            if [ -z "${resolved_sha}" ] && [ -n "${version}" ]; then
              resolved_sha=$(gh api "repos/${REPO}/commits/${version}" --jq .sha || true)
            fi
            # The tests ran from the tested revision, so read its checkpoint map.
            local map_args=()
            if [ -n "${resolved_sha}" ]; then
              map_args=(--checkpoint-map "${input}/tested-map.json")
              if git fetch --quiet --depth 1 origin "${resolved_sha}"; then
                git show "FETCH_HEAD:common/testing/data/core-journey-checkpoints.json" \
                  > "${input}/tested-map.json" 2>/dev/null || rm -f "${input}/tested-map.json"
              fi
            fi
            python3 -I common/testing/journey_board.py build-record \
              --artifact-dir "${input}/artifact" \
              --run-json "${input}/run.json" \
              --jobs-json "${input}/jobs.json" \
              --board-dir board-new \
              --repository "${REPO}" \
              --resolved-sha "${resolved_sha}" \
              "${map_args[@]}" | tee -a board-input/result.txt
          }
          mkdir -p board-input board-new
          failed=""
          for run_id in ${RUN_IDS}; do
            if ! ( build_one "${run_id}" ); then
              failed="${failed} ${run_id}"
            fi
          done
          if find board-new -name '*.json' | grep -q .; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "failed=$(echo "${failed}" | xargs)" >> "$GITHUB_OUTPUT"

      - name: Push the records and regenerate the board
        if: steps.record.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No concurrency group: a group drops a pending publish. Each attempt
          # starts from the newest gh-pages, adds the record files and
          # regenerates the index from all records, so a lost race only retries.
          for attempt in 1 2 3 4 5; do
            git -C pages fetch --depth 1 origin gh-pages
            git -C pages reset --hard FETCH_HEAD
            mkdir -p pages/board
            cp -R board-new/records pages/board/
            python3 -I common/testing/journey_board.py build-index --board-dir pages/board
            git -C pages add board
            if git -C pages diff --cached --quiet; then
              echo "The board already holds these records."
              exit 0
            fi
            git -C pages commit -q -m "board: record runs ${{ steps.select.outputs.ids }}"
            if git -C pages push origin HEAD:gh-pages; then
              echo "Published on attempt ${attempt}."
              exit 0
            fi
            sleep $(( attempt * 3 + RANDOM % 7 ))
          done
          echo "::error::Could not push the board records after 5 attempts."
          exit 1

      - name: Fail when a run could not be built
        if: steps.record.outputs.failed != ''
        run: |
          echo "::error::Could not build the board record of runs: ${{ steps.record.outputs.failed }}"
          exit 1

      - name: Write the step summary
        if: always()
        run: |
          {
            echo "### Journey board"
            echo ""
            echo "- Runs: ${{ steps.select.outputs.ids || 'none' }}"
            echo "- Result: $(cat board-input/result.txt 2>/dev/null || echo 'no record')"
            echo "- Board: https://wangzitian0.github.io/finance_report/board/"
          } >> "$GITHUB_STEP_SUMMARY"
