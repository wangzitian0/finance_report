name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*', 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/finance_report
  PYTHON_VERSION: "3.12.12"
  NODE_VERSION: "20.19.0"
  UV_VERSION: "0.9.18"

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pr_required: ${{ steps.gates.outputs.pr_required }}
      pr_reason: ${{ steps.gates.outputs.pr_reason }}
      # True only when the Docker build context changed (Dockerfile/deps/lockfiles/
      # build config/entrypoint). Pure app-source changes are proven by frontend-build
      # and the backend test jobs, so container-images is right-moved off them.
      image_build_required: ${{ steps.classify.outputs.image_build_required }}
      # #1689: per-component change flags, so a PR only pays for what it touched
      # (frontend-telemetry-e2e skip).
      backend_changed: ${{ steps.classify.outputs.backend_changed }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      tools_changed: ${{ steps.classify.outputs.tools_changed }}
      common_changed: ${{ steps.classify.outputs.common_changed }}
      touched_e2e_tests: ${{ steps.classify.outputs.touched_e2e_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          base_sha="${BASE_SHA:-}"
          head_sha="${HEAD_SHA:-}"

          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || git rev-parse HEAD^)"
          fi

          if ! git diff --name-only "$base_sha" "$head_sha" > changed-files.txt; then
            git diff --name-only HEAD^ HEAD > changed-files.txt
          fi

          python tools/ci_change_classifier.py \
            --changed-files changed-files.txt \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Normalize Env x Stage gates
        id: gates
        env:
          ENV_STAGE_REQUIRED: ${{ steps.classify.outputs.env_stage_required }}
          ENV_STAGE_REASONS: ${{ steps.classify.outputs.env_stage_reasons }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              print("pr_required=false")
              print("pr_reason=tag-push-promotion-only")
          else:
              required = json.loads(os.environ["ENV_STAGE_REQUIRED"])
              reasons = json.loads(os.environ["ENV_STAGE_REASONS"])
              print(f"pr_required={str(required['pr']).lower()}")
              print(f"pr_reason={reasons['pr']}")
          PY

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed by the PR Review Thread Merge Gate step: `gh api graphql` reads
      # the PR's review threads. The top-level `permissions:` block restricts
      # GITHUB_TOKEN to actions/contents read, so grant pull-requests read here.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret Scan (gitleaks)
        uses: ./.github/actions/gitleaks-scan
      - name: Toolchain Contract Check
        run: python tools/check_toolchain_contract.py
      - name: Lockfile Registry Check
        run: python tools/check_lockfile_registry.py
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install uv
        uses: ./.github/actions/setup-uv-retry
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Keep exactly one setup-uv cache writer per CI run. Other jobs restore
          # the shared cache but do not race to reserve the same save key.
          save-cache: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Fast-fail (left-move): these SSOT/contract gates are app-independent
      # (`uv run --with pyyaml[--with pydantic]`, no backend sync / npm) and are
      # the drift classes behind most CI failures. Running them BEFORE the
      # expensive `uv sync` + `npm ci` means a drift fails in ~20s instead of
      # after ~50s of setup. Same checks, no coverage change; ordering only.
      # Contract-loading gates need `pydantic`: the manifest gate projects
      # package concepts (#1799), while the AC-index gate projects package AC
      # vision anchors (#1858). Both remain isolated `--with` overlays rather
      # than a full backend `uv sync`.
      - name: SSOT Manifest Check
        run: |
          uv run --with pyyaml --with pydantic python tools/check_manifest.py
      - name: SSOT Governance Exceptions Check
        run: |
          uv run --with pyyaml python tools/check_governance_exceptions.py
      - name: SSOT Governance Report
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          base_sha="${BASE_SHA:-}"
          head_sha="${HEAD_SHA:-}"

          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || git rev-parse HEAD^)"
          fi

          if ! git diff --name-only "$base_sha...$head_sha" > "$RUNNER_TEMP/ssot-changed-files.txt"; then
            git diff --name-only "$base_sha" "$head_sha" > "$RUNNER_TEMP/ssot-changed-files.txt"
          fi

          # --with pydantic (#1799): report_ssot_governance.py's finance_report
          # source now routes through check_manifest.py's computed union,
          # which loads package contracts (pydantic-backed PackageContract).
          uv run --with pyyaml --with pydantic python tools/report_ssot_governance.py \
            --changed-files "$RUNNER_TEMP/ssot-changed-files.txt" \
            --base-ref "$base_sha" \
            --fail-on-gate \
            --json-out "$RUNNER_TEMP/ssot-governance-report.json" \
            --markdown-out "$RUNNER_TEMP/SSOT-GOVERNANCE-REPORT.md"
          cat "$RUNNER_TEMP/SSOT-GOVERNANCE-REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Migration Risk Contract Check
        run: |
          uv run --with pyyaml python tools/check_migration_risk.py
      - name: CI Metrics Contract Check
        run: |
          uv run --with pyyaml python tools/check_ci_metrics_contract.py
      - name: Workflow Contract Check
        run: |
          uv run --with pyyaml python tools/check_workflow_contract.py
      - name: SSOT Ownership Lint
        run: |
          python tools/check_ssot_ownership.py --verbose
      - name: Set up backend environment
        uses: ./.github/actions/setup-backend-env
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run Lint
        run: |
          cd apps/backend
          uv run --frozen ruff check src tests
          uv run --frozen ruff format src tests --check
      - name: Detached Owner Shortcut Guard
        run: |
          uv run --frozen --directory apps/backend python ../../tools/check_detached_owner_shortcuts.py
      - name: Router Contract Maturity Guard
        run: |
          uv run --frozen --directory apps/backend python ../../tools/audit_router_contracts.py --check
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend
      - name: Audit frontend production dependencies
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base_sha="${BASE_SHA:-}"
            head_sha="${HEAD_SHA:-}"
            if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || git rev-parse HEAD^)"
            fi
            if ! changed_files="$(git diff --name-only "$base_sha...$head_sha" 2>/dev/null)"; then
              changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
            fi
            if ! printf '%s\n' "${changed_files}" | grep -Eq '^(apps/frontend/package(-lock)?\.json|package-lock\.json)$'; then
              echo "Skipping frontend security audit on PR: no frontend dependency files changed."
              exit 0
            fi
          fi
          cd apps/frontend
          npm run audit:prod
      - name: Run Frontend Lint
        run: npm run lint
        working-directory: apps/frontend
      - name: Doc Consistency Check
        run: |
          uv run --with pyyaml python tools/lint_doc_consistency.py
      - name: Generated API Reference Check
        run: |
          cd apps/backend
          uv run --frozen python ../../tools/generate_api_reference.py --check
      - name: Generated OpenAPI Spec and API Types Check
        run: |
          # The committed apps/frontend/openapi.json and src/lib/api-types.ts must
          # equal the generated output (#2378). The command list is the
          # `openapi-spec` gate of common/testing/preflight.py, so CI and the
          # local pre-push run share one source. Needs the backend venv and the
          # frontend dependencies installed by the steps above.
          cd apps/backend
          uv run --frozen python ../../tools/preflight.py --only openapi-spec --ci
      - name: EPIC Status Pointer Check
        run: |
          # The EPIC-status numbers are a derived (not committed) view of the AC
          # graph; this only verifies the README pointer block is intact, never a
          # shifted AC total.
          uv run --with pyyaml python tools/generate_epic_status.py --check
      - name: AC Index Consistency Check
        run: |
          # The SINGLE AC-index gate, exactly TWO gates over the AC-keyed graph:
          # A) INTEGRITY (hard) — every AC managed + no dangling link, PLUS the
          #    two folded former-standalone contracts: CI-stage traceability
          #    (mandatory ACs must resolve to a real ref in a CI-required stage,
          #    with placeholder/stub/unexecuted classifications) and the
          #    critical-proof matrix contract (trust_mode/mirror/markers/scope/
          #    ci_tier/manual-gate evidence + macro-outcome shape). The old
          #    check_ac_traceability / check_critical_proof_matrix gate STEPS are
          #    retired; their logic runs here by importing them as libraries.
          # B) PROTECTION RATCHET — per-type count floor over protection-floor.json.
          uv run --with pyyaml --with pydantic python tools/check_ac_index.py
      - name: AC Authority-Tier Ratchet
        run: |
          # EPIC-026: shrink-only ratchet over common/meta/data/ac-tier-baseline.json.
          # Id-based: fails only when an AC whose id is absent from the baseline
          # (a genuinely new AC) lacks a {tier:XX} marker; the legacy untagged AC
          # ids in the baseline are tolerated and the debt may only shrink.
          uv run --with pyyaml python tools/check_ac_tier_baseline.py
      - name: AC Proof-Kind Matrix Enforcement
        run: |
          # EPIC-026 phase 2: enforce the tier->valid-proof-kind matrix
          # (common/meta/readme.md) for ACs that carry a {tier:XX}.
          # Untagged legacy ACs have no proof_kind and are ignored (non-breaking).
          # The rule with teeth: an LLM-LED AC's proof_kind MUST NOT be `exact`
          # (an LLM-emitted output cannot be proven by an exact golden assertion);
          # HU must be `evidence`; LLM-ONLY must not be exact.
          uv run --with pyyaml python tools/check_ac_proof_kind.py
      - name: Package-Model Migration-Safety Gates
        run: |
          # EPIC-026 phase 5 (#1355) & #2133: consolidated package-model migration safety
          # and contract gates (tier AST literal, dual definition, draft registration,
          # authority reconcile, gate main contract, baseline update contract, tool shim contract).
          uv run --with pyyaml python tools/check_package_migration_safety.py
      - name: Package Contract Check
        run: |
          cd apps/backend
          uv run --frozen python ../../tools/preflight.py --only package-contract --ci
      - name: Tier Import Guard (CODE-ONLY must not import the LLM layer)
        run: |
          # EPIC-026 phase 3: enforce the cross-tier STRUCTURAL MUST rule
          # (common/meta/readme.md, rule 2 "CODE-ONLY stays pure"). AST-based,
          # direct-imports-only: a curated set of CODE-ONLY/financial-truth modules
          # (money/**, ledger/**, journal model, deterministic services) must
          # not import the LLM layer (src.llm) or a raw provider SDK
          # (litellm/openrouter/anthropic/openai). GREEN on main today; this is a
          # regression guard that keeps the deterministic core pure.
          python tools/check_tier_imports.py
      - name: LLM Cassette Integrity (balance-chain invariant)
        run: |
          # EPIC-023 AC23.7 / #1306-7: every committed statement-extraction
          # cassette must satisfy opening + Σ amounts ≈ closing (Decimal). A
          # re-recorded cassette where the LLM drifted into an inconsistent
          # extraction fails here. Pure Python (no key/network/DB), so it runs in
          # lint without touching the AC behavioral-score aggregator.
          python tools/check_llm_cassettes.py
      - name: LLM Cassette Graded Eval (field-accuracy drift ratchet)
        run: |
          # EPIC-023 AC23.8 / #1307: GRADED field-accuracy eval over committed
          # cassettes. AC23.7 above gates CONSISTENCY (the chain reconciles); this
          # gates ACCURACY — each cassette is scored per-field against a synthetic
          # ground truth and ratcheted against a per-case floor that only goes UP.
          # Fails when a refreshed cassette regresses below floor (incl. "balance
          # passes but a field is wrong"). Pure Python (no key/network/DB), so it
          # runs in lint without touching the AC behavioral-score aggregator.
          python tools/check_cassette_graded_eval.py
      - name: PR Review Thread Merge Gate
        # Issue #755 (scope 2a): block merge while an unresolved P0/P1 (or
        # unresolved Copilot-authored) review thread is open. Skips cleanly on
        # non-PR events because PR_NUMBER is empty (the checker exits 0).
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python tools/check_pr_review_threads.py

  schema-migrations:
    name: Schema Migration Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.pr_required == 'true'

    services:
      postgres:
        image: postgres:15.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_report_test
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend-env
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Alembic migration contract
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/finance_report_test
        run: |
          set -euo pipefail
          cd apps/backend
          mkdir -p test-results ci-context
          {
            echo "Schema Migration Context"
            echo "========================"
            echo "repository=${{ github.repository }}"
            echo "event_name=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "database=finance_report_test"
            echo "proof=alembic-upgrade-head-plus-alembic-check"
          } > ci-context/schema-migration-context.txt
          {
            echo "[schema-migration] uv run --frozen alembic upgrade head"
            uv run --frozen alembic upgrade head
            echo "[schema-migration] uv run --frozen alembic check"
            uv run --frozen alembic check
          } 2>&1 | tee test-results/schema-migration.log

      - name: Upload schema migration test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: schema-migration-test-context
          path: |
            apps/backend/test-results/schema-migration.log
            apps/backend/ci-context/schema-migration-context.txt
          overwrite: true
          retention-days: 14
  backend:
    name: Backend Tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.pr_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The matrix is the one place that sets the shard count: the job name and
        # --splits read strategy.job-total. Raise it when the slowest shard
        # passes 4 minutes (#2688).
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    services:
      postgres:
        image: postgres:15.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_report_test
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend-env
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}



      - name: Run Tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/finance_report_test
          S3_ACCESS_KEY: minio
          S3_SECRET_KEY: minio_local_secret
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: statements
          ENABLE_STORAGE_SWEEP: "false"
        run: |
          cd apps/backend
          mkdir -p test-results
          python - <<'PY'
          import json
          from pathlib import Path

          seed = Path("ci/backend-test-durations.json")
          if not seed.exists():
              raise SystemExit(f"pytest-split duration seed is missing: {seed}")
          durations = json.loads(seed.read_text(encoding="utf-8"))
          if len(durations) < 500:
              raise SystemExit(
                  f"pytest-split duration seed is too small: {len(durations)} entries"
              )
          print(f"Loaded pytest-split duration seed with {len(durations)} entries")
          PY
          # File-level seeded split (common/testing/backend_shard.py): the same
          # least_duration rule pytest-split applies to items, applied to whole
          # test files, so this shard collects only its own files instead of
          # importing the entire suite under --cov-branch to keep an assigned slice of
          # it (that collection alone was 37-58 s per shard, #2050). Every
          # tests/**/test_*.py file lands in exactly one shard.
          python ../../tools/backend_shard_files.py \
            --splits ${{ strategy.job-total }} \
            --group ${{ matrix.shard }} \
            --splitting-algorithm=least_duration \
            --durations-path ci/backend-test-durations.json \
            > "$RUNNER_TEMP/backend-shard-tests.txt"
          BACKEND_SHARD_TESTS=()
          while IFS= read -r test_file; do
            BACKEND_SHARD_TESTS+=("$test_file")
          done < "$RUNNER_TEMP/backend-shard-tests.txt"
          if [ "${#BACKEND_SHARD_TESTS[@]}" -eq 0 ]; then
            echo "::error::backend shard ${{ matrix.shard }}/${{ strategy.job-total }} selected no test files"
            exit 1
          fi
          echo "Shard ${{ matrix.shard }}/${{ strategy.job-total }} runs ${#BACKEND_SHARD_TESTS[@]} test files"
          uv run pytest -n auto -v \
            -m "not slow and not e2e and not integration" \
            --cov=src \
            --cov-report=lcov:coverage-backend-${{ matrix.shard }}.lcov \
            --cov-report=term-missing \
            --cov-branch \
            --cov-fail-under=0 \
            --dist load \
            --junit-xml=test-results/backend-shard-${{ matrix.shard }}.xml \
            "${BACKEND_SHARD_TESTS[@]}"

      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend-${{ matrix.shard }}
          path: apps/backend/coverage-backend-${{ matrix.shard }}.lcov
          overwrite: true
          retention-days: 14

      - name: Upload backend shard test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-shard-${{ matrix.shard }}-test-context
          path: |
            apps/backend/test-results/backend-shard-${{ matrix.shard }}.xml
            apps/backend/test-results/served-cassettes*.txt
            apps/backend/coverage-backend-${{ matrix.shard }}.lcov
          overwrite: true
          retention-days: 14

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.pr_required == 'true'

    services:
      postgres:
        image: postgres:15.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_report_test
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      # Started in the background right after checkout, so the image pulls
      # and the MinIO boot overlap uv/Python/venv setup instead of queueing
      # behind it. "Wait for MinIO" blocks on the outcome before any
      # test runs, and a setup failure still fails the job there.
      - name: Start MinIO
        uses: ./.github/actions/setup-minio
        with:
          container-name: finance-report-minio-integration

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend-env
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      # #1828 G-health-honest-somewhere: this lane runs the REAL Bootloader
      # _check_database/_check_s3 (tests/integration/test_bootloader_real_checks.py),
      # so it needs a live S3-compatible service, not just the env vars.
      - name: Wait for MinIO
        uses: ./.github/actions/setup-minio
        with:
          step: wait

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/finance_report_test
          S3_ACCESS_KEY: minio
          S3_SECRET_KEY: minio_local_secret
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: statements
          ENABLE_STORAGE_SWEEP: "false"
        run: |
          cd apps/backend
          mkdir -p test-results
          uv run pytest -n auto -v \
            --override-ini addopts="" \
            -m "integration" \
            --dist load \
            --junit-xml=test-results/backend-integration.xml

      - name: Upload backend integration test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-test-context
          path: |
            apps/backend/test-results/backend-integration.xml
            apps/backend/test-results/served-cassettes*.txt
          overwrite: true
          retention-days: 14

      - name: Stage Contribution Summary (Behavioral proof only)
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Backend Integration Stage
          - Scope: `-m "integration"` backend suites
          - Contribution: behavior proof channel only
          - Coverage effect: **not included** in unified line coverage baseline for now
          EOF

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    # AC-testing.ci-structure.11: right-moved off PRs that touch no
    # apps/frontend/** path, mirroring frontend-telemetry-e2e's
    # frontend_changed gate (#1689) -- this job's proof (typecheck + prod
    # build) is not coverage-scoped, so narrowing it costs nothing unified-
    # coverage depends on.
    if: needs.changes.outputs.pr_required == 'true' && needs.changes.outputs.frontend_changed == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Cache Next.js
        uses: actions/cache@v5
        with:
          path: apps/frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-${{ hashFiles('apps/frontend/**/*.ts', 'apps/frontend/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Run Frontend Type Check
        run: npm run typecheck
        working-directory: apps/frontend

      - name: Build Frontend
        run: npm run build
        working-directory: apps/frontend

  frontend-vitest:
    name: Frontend Vitest Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.pr_required == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Run Frontend Tests
        run: |
          mkdir -p test-results
          npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-junit.xml
        working-directory: apps/frontend

      - name: Upload frontend coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: apps/frontend/coverage/lcov.info
          overwrite: true
          retention-days: 14

      - name: Upload frontend Vitest test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-vitest-test-context
          path: |
            apps/frontend/test-results/
            apps/frontend/coverage/lcov.info
          overwrite: true
          retention-days: 14

  frontend-playwright:
    name: Frontend Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes]
    # AC-testing.ci-structure.11: right-moved off PRs that touch no
    # apps/frontend/** path, mirroring frontend-telemetry-e2e's
    # frontend_changed gate (#1689) -- this job's proof (provider-free
    # browser E2E) is not coverage-scoped, so narrowing it costs nothing.
    # Unlike frontend-telemetry-e2e it is not a
    # production observability canary, so (like backend/frontend-build) it
    # gates on pr_required uniformly with no always-run-on-push override
    # (AC-testing.deploy-gates.25).
    if: needs.changes.outputs.pr_required == 'true' && needs.changes.outputs.frontend_changed == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Cache Next.js
        uses: actions/cache@v5
        with:
          path: apps/frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-${{ hashFiles('apps/frontend/**/*.ts', 'apps/frontend/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Build Frontend
        run: npm run build
        working-directory: apps/frontend

      - name: Install Frontend Playwright Browser
        uses: ./.github/actions/install-playwright
        with:
          command: npx playwright
          working-directory: apps/frontend

      - name: Run Frontend Playwright Tests
        run: npm run test:e2e -- --reporter=line,html
        working-directory: apps/frontend

      - name: Upload frontend Playwright test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-test-context
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          overwrite: true
          retention-days: 14

  frontend-telemetry-e2e:
    name: Frontend Telemetry E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes]
    # #1689: right-moved off unrelated PRs (browser install is ~2-3 min). Always
    # runs on main/release push and manual dispatch (this is the production
    # observability canary); on a PR it only runs when apps/frontend/** changed,
    # mirroring container-images' image_build_required pattern above.
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))
      || github.event_name == 'workflow_dispatch'
      || (needs.changes.outputs.pr_required == 'true' && needs.changes.outputs.frontend_changed == 'true')

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Cache Next.js
        uses: actions/cache@v5
        with:
          path: apps/frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-${{ hashFiles('apps/frontend/**/*.ts', 'apps/frontend/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Build Frontend
        run: npm run build
        working-directory: apps/frontend

      - name: Install Frontend Playwright Browser
        uses: ./.github/actions/install-playwright
        with:
          command: npx playwright
          working-directory: apps/frontend

      - name: Run Frontend Telemetry-Emission E2E (#1169 / EPIC-024 AC24.2)
        # Real-browser proof that browser OTel spans export to /v1/traces and
        # OpenPanel events dispatch. Runs under its own config because it injects
        # the OTel + OpenPanel config via webServer.env (hermetic: every
        # telemetry destination is intercepted in-test).
        run: npm run test:e2e:telemetry
        working-directory: apps/frontend

      - name: Upload frontend telemetry E2E test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-telemetry-test-context
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          overwrite: true
          retention-days: 14

  container-images:
    name: Build Staging Images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes]
    # Main/release push (and manual dispatch) ALWAYS build + push the immutable
    # per-commit :<sha> image: the Dockerfiles COPY app source into the image, so
    # every commit's image content differs, and promote-not-rebuild (deploy_v2
    # release) requires a :<sha> artifact for any releasable commit. A build-context
    # gate alone (image_build_required) leaves source-only / submodule-only commits
    # with no :<sha> image to promote. PR keeps the narrow build-context-only
    # dry-run for speed (no push happens on PRs anyway).
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))
      || github.event_name == 'workflow_dispatch'
      || (needs.changes.outputs.pr_required == 'true' && needs.changes.outputs.image_build_required == 'true')
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Get Commit SHA
        id: get_sha
        run: |
          full_sha=$(git rev-parse HEAD)
          short_sha="${full_sha:0:7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "Building staging images for commit: $short_sha"

      - name: Build-context Secret Scan (gitleaks)
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/gitleaks-scan
        with:
          source: apps/${{ matrix.component }}

      - name: Log in to Container registry
        # P1a (#879, AC7.12.4): publish :<sha> for main + release-branch commits, and
        # on demand via workflow_dispatch (the rare "preview an unmerged sha" escape hatch).
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend SHA image
        if: matrix.component == 'backend'
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend
          push: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || github.event_name == 'workflow_dispatch' }}
          # Plain single-manifest image: provenance/sbom attestations turn the push
          # into an OCI index that legacy (non-containerd) docker hosts choke on when
          # pulling. Keep images plainly pullable everywhere.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.get_sha.outputs.short_sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ steps.get_sha.outputs.short_sha }}

      - name: Build Frontend SHA image
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@v7
        with:
          context: ./apps/frontend
          push: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || github.event_name == 'workflow_dispatch' }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.get_sha.outputs.short_sha }}
          # G1 (#898, AC7.12.8): the published :<sha> image must be environment-independent.
          # Do NOT bake NEXT_PUBLIC_API_URL or NEXT_PUBLIC_APP_URL here — the front end uses
          # the same-origin relative /api path, so one image promotes unchanged across
          # staging and prod.
          build-args: |
            GIT_COMMIT_SHA=${{ steps.get_sha.outputs.short_sha }}

  verify-sha-image-published:
    name: Verify Commit Image Published
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [container-images]
    # #1759 (W4 of #1435): "every main commit produces a promotable :<sha>"
    # was previously guaranteed only by design (container-images always
    # builds+pushes on main push) — nothing verified the guarantee actually
    # held for a given commit. A push where the build step reports success
    # but the image never lands in the registry would only surface later, at
    # promote time. This job independently re-inspects the registry (not
    # trusting the build step's own self-report) immediately after the
    # build, so a violation is caught at commit time. container-images
    # always runs on main push (see its own if:), so needs: alone is enough
    # to gate this on that job's success.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install infra2-sdk
        uses: ./.github/actions/install-infra2-sdk

      - name: Get Commit SHA
        id: get_sha
        run: |
          full_sha=$(git rev-parse HEAD)
          short_sha="${full_sha:0:7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Log in to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify :<sha> images exist in registry
        run: |
          set -euo pipefail
          python tools/verify_release_images.py \
            --registry "${{ env.REGISTRY }}" \
            --image-prefix "${{ env.IMAGE_PREFIX }}" \
            --version-ref "${{ steps.get_sha.outputs.short_sha }}"

  finish:
    needs: [changes, schema-migrations, backend, backend-integration, frontend-build, frontend-vitest, frontend-playwright, frontend-telemetry-e2e, container-images, verify-sha-image-published, lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The finish job's merge authority is the "Check job status" step alone. The
      # three summary steps below are non-gating reporting and all carry
      # continue-on-error so a step-summary write can never fail the merge gate.
      # Orphan enforcement only makes sense when the backend suites actually ran:
      # on lightweight (docs/ci-only) pushes the heavy jobs are skipped, no
      # served-manifest artifacts exist, and every non-truth-paired cassette
      # would read as a false orphan (seen on main 8cdfde41: served=0, orphans=5).
      - name: Download backend test contexts (cassette orphan gate)
        if: ${{ needs.backend.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: "backend-*test-context"
          path: cassette-usage
      - name: Cassette orphan gate
        if: ${{ needs.backend.result == 'success' }}
        run: |
          # #1596 AC-llm.10.6 / #1597: every committed cassette must be JUSTIFIED —
          # either SERVED by at least one backend test job, or paired with a
          # ground_truth/*.truth.json (the graded-eval corpus consumes those by
          # truth-file iteration in the root tooling lane, which uploads no
          # served-manifest). An unjustified cassette is a changed-prompt leftover
          # (the fingerprint moved; the old frozen response can never be reached
          # again). Fails loudly instead of letting dead fixtures accumulate.
          python3 - <<'PY'
          from pathlib import Path

          cassette_dir = Path("common/testing/fixtures/llm_cassettes")
          committed = {p.stem for p in cassette_dir.glob("*.json")}
          truth_paired = {
              p.name.removesuffix(".truth.json")
              for p in (cassette_dir / "ground_truth").glob("*.truth.json")
          }
          served = set()
          for f in Path("cassette-usage").rglob("served-cassettes*.txt"):
              served |= {line.strip() for line in f.read_text().splitlines() if line.strip()}
          orphans = sorted(committed - served - truth_paired)
          print(
              f"committed={len(committed)} served={len(served & committed)} "
              f"truth_paired={len(truth_paired)} orphans={len(orphans)}"
          )
          if orphans:
              print("ORPHANED cassettes (no backend job served them — changed-prompt leftovers):")
              for o in orphans:
                  print(f"  common/testing/fixtures/llm_cassettes/{o}.json")
              raise SystemExit(1)
          PY

      - name: Write Coverage-Effect Stage Summary
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cat << "EOF" >> "$GITHUB_STEP_SUMMARY"
          ## CI Stage Coverage Effects

          | Stage | Coverage Effect | Behavior Proof |
          |---|---|---|
          | schema-migrations | not included in unified coverage | yes (Alembic DDL/schema drift) |
          | backend (sharded) | contributes to unified line coverage baseline | yes |
          | backend-integration | not included in unified coverage | yes (marker 'integration') |
          | frontend-build | not included in unified coverage | yes (typecheck + production build) |
          | frontend-vitest | contributes to unified line coverage baseline | yes |
          | frontend-playwright | not included in unified coverage | yes (provider-free browser UI) |
          | frontend-telemetry-e2e | not included in unified coverage | yes (browser telemetry emission) |
          EOF

      - name: Set up Python for the timing summary
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install infra2-sdk for the timing summary
        uses: ./.github/actions/install-infra2-sdk

      - name: Write CI timing summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/github_workflow_timing_summary.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --title "CI Timing Summary" \
            --summary-path "$GITHUB_STEP_SUMMARY"

      - name: Check job status
        if: ${{ always() }}
        run: |
          echo "Change Classification: ${{ needs.changes.result }}"
          echo "PR Env Required: ${{ needs.changes.outputs.pr_required }}"
          echo "PR Env Reason: ${{ needs.changes.outputs.pr_reason }}"
          echo "Schema Migrations: ${{ needs.schema-migrations.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Frontend Vitest: ${{ needs.frontend-vitest.result }}"
          echo "Frontend Playwright: ${{ needs.frontend-playwright.result }}"
          echo "Frontend Telemetry E2E: ${{ needs.frontend-telemetry-e2e.result }}"
          echo "Staging Images: ${{ needs.container-images.result }}"
          echo "Verify Commit Image Published: ${{ needs.verify-sha-image-published.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::Change classification failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::Lint failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.pr_required }}" == "true" ]]; then
            if [[ "${{ needs.schema-migrations.result }}" != "success" ]]; then
              echo "::error::Schema migration contract failed"
              exit 1
            fi
            if [[ "${{ needs.backend.result }}" != "success" ]]; then
              echo "::error::Backend tests failed"
              exit 1
            fi
            if [[ "${{ needs.backend-integration.result }}" != "success" ]]; then
              echo "::error::Backend integration tests failed"
              exit 1
            fi
            # AC-testing.ci-structure.11: frontend-build is right-moved off PRs
            # that touch no apps/frontend/** path (frontend_changed=false),
            # which is a pass, not a gap — mirrors frontend-telemetry-e2e's
            # skip-is-a-pass clause below.
            if [[ "${{ needs.frontend-build.result }}" != "success" && "${{ needs.frontend-build.result }}" != "skipped" ]]; then
              echo "::error::Frontend build/typecheck failed"
              exit 1
            fi
            if [[ "${{ needs.frontend-vitest.result }}" != "success" ]]; then
              echo "::error::Frontend Vitest coverage failed"
              exit 1
            fi
            # AC-testing.ci-structure.11: frontend-playwright is right-moved
            # the same way as frontend-build above.
            if [[ "${{ needs.frontend-playwright.result }}" != "success" && "${{ needs.frontend-playwright.result }}" != "skipped" ]]; then
              echo "::error::Frontend Playwright failed"
              exit 1
            fi
            # #1689: frontend-telemetry-e2e is right-moved off PRs that touch no
            # apps/frontend/** path (frontend_changed=false), which is a pass,
            # not a gap — mirrors container-images' skip-is-a-pass clause below.
            if [[ "${{ needs.frontend-telemetry-e2e.result }}" != "success" && "${{ needs.frontend-telemetry-e2e.result }}" != "skipped" ]]; then
              echo "::error::Frontend telemetry E2E failed"
              exit 1
            fi
            # container-images is right-moved: it is skipped when the build context
            # did not change (image_build_required=false), which is a pass, not a gap.
            if [[ "${{ needs.container-images.result }}" != "success" && "${{ needs.container-images.result }}" != "skipped" ]]; then
              echo "::error::Container image validation failed"
              exit 1
            fi
            # verify-sha-image-published only runs on main push (see its own if:) —
            # skipped on PRs and non-main pushes, which is a pass, not a gap.
            if [[ "${{ needs.verify-sha-image-published.result }}" != "success" && "${{ needs.verify-sha-image-published.result }}" != "skipped" ]]; then
              echo "::error::Commit image publication verification failed"
              exit 1
            fi
          else
            echo "Heavy backend/frontend/coverage jobs skipped for lightweight changes."
          fi
          echo "✅ All checks passed!"

  # #2688: the time budget of this run. A PR run only prints the verdict. A main run past its
  # budget turns this job red and comments on the budget issue. Job-level continue-on-error
  # keeps the ci.yml run conclusion green whatever happens here (an overrun, a script crash,
  # a missing timing input or an SDK install flake): release.yml requires a successful main
  # CI run (verify_source_ci), so this job must never decide that conclusion.
  pipeline-budget:
    name: Pipeline Budget
    needs: [finish]
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install infra2-sdk
        uses: ./.github/actions/install-infra2-sdk

      - name: Print the time budget verdict
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/github_workflow_timing_summary.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --title "CI Time Budget" \
            --summary-path "$GITHUB_STEP_SUMMARY" \
            --budget "${{ github.event_name == 'pull_request' && 'pr' || 'main' }}"

      # No step-level continue-on-error: a budget check that cannot run must show red on this job.
      - name: Enforce the main-branch time budget
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/github_workflow_timing_summary.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --title "Main CI Time Budget" \
            --summary-path "$GITHUB_STEP_SUMMARY" \
            --budget main \
            --enforce \
            --comment

      - name: Report pipeline budget failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ISSUE: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '2688' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- pipeline-budget-alert:${GITHUB_RUN_ID} -->"
          body="${marker}
          ⚠️ **Pipeline Budget Alert**: The \`pipeline-budget\` job failed (budget violation, unmeasured run, script crash, or SDK install flake) on [run ${GITHUB_RUN_ID}](${RUN_URL})."
          existing_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${TARGET_ISSUE}/comments" --jq ".[] | select(.body | contains(\"<!-- pipeline-budget-alert\")) | .id" | head -n 1 || true)"
          if [ -n "$existing_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="$body"
          else
            gh issue comment "$TARGET_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  promote-release-images:
    name: Promote Release Tag Images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release tag is on main
        run: |
          set -euo pipefail
          git fetch origin main --depth=100
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install infra2-sdk
        uses: ./.github/actions/install-infra2-sdk
      - name: Log in to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Retag :<sha> images as release tag
        run: |
          set -euo pipefail
          full_sha=$(git rev-parse HEAD)
          short_sha="${full_sha:0:7}"
          tag_name="${GITHUB_REF_NAME}"
          python tools/verify_release_images.py \
            --registry "${{ env.REGISTRY }}" \
            --image-prefix "${{ env.IMAGE_PREFIX }}" \
            --version-ref "$short_sha"
          for component in backend frontend; do
            src_img="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${component}:${short_sha}"
            dst_img="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${component}:${tag_name}"
            docker buildx imagetools create --prefer-index=false --tag "$dst_img" "$src_img"
          done
          python tools/verify_release_images.py \
            --registry "${{ env.REGISTRY }}" \
            --image-prefix "${{ env.IMAGE_PREFIX }}" \
            --version-ref "$tag_name"
