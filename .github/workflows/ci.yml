name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/finance_report
  PYTHON_VERSION: "3.12.12"
  NODE_VERSION: "20.19.0"
  UV_VERSION: "0.9.18"

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_required: ${{ steps.gates.outputs.pr_required }}
      pr_reason: ${{ steps.gates.outputs.pr_reason }}
      # True only when the Docker build context changed (Dockerfile/deps/lockfiles/
      # build config/entrypoint). Pure app-source changes are proven by frontend-build
      # and the backend test jobs, so container-images is right-moved off them.
      image_build_required: ${{ steps.classify.outputs.image_build_required }}
      # #1689: per-component change flags, so a PR only pays for what it touched
      # (frontend-telemetry-e2e skip, unified-coverage gate scoping).
      backend_changed: ${{ steps.classify.outputs.backend_changed }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      tools_changed: ${{ steps.classify.outputs.tools_changed }}
      common_changed: ${{ steps.classify.outputs.common_changed }}
      coverage_gate_components: ${{ steps.classify.outputs.coverage_gate_components }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          base_sha="${BASE_SHA:-}"
          head_sha="${HEAD_SHA:-}"

          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || git rev-parse HEAD^)"
          fi

          if ! git diff --name-only "$base_sha" "$head_sha" > changed-files.txt; then
            git diff --name-only HEAD^ HEAD > changed-files.txt
          fi

          python tools/ci_change_classifier.py \
            --changed-files changed-files.txt \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Normalize Env x Stage gates
        id: gates
        env:
          ENV_STAGE_REQUIRED: ${{ steps.classify.outputs.env_stage_required }}
          ENV_STAGE_REASONS: ${{ steps.classify.outputs.env_stage_reasons }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          required = json.loads(os.environ["ENV_STAGE_REQUIRED"])
          reasons = json.loads(os.environ["ENV_STAGE_REASONS"])
          print(f"pr_required={str(required['pr']).lower()}")
          print(f"pr_reason={reasons['pr']}")
          PY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed by the PR Review Thread Merge Gate step: `gh api graphql` reads
      # the PR's review threads. The top-level `permissions:` block restricts
      # GITHUB_TOKEN to actions/contents read, so grant pull-requests read here.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret Scan (gitleaks)
        uses: ./.github/actions/gitleaks-scan
      - name: Toolchain Contract Check
        run: python tools/check_toolchain_contract.py
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install uv
        uses: ./.github/actions/setup-uv-retry
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Keep exactly one setup-uv cache writer per CI run. Other jobs restore
          # the shared cache but do not race to reserve the same save key.
          save-cache: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The DDD dependency report is the slowest lint check (two full AST
      # snapshots, base and HEAD). It starts here in the background and the
      # "DDD Dependency Impact Report" step near the end of this job waits for
      # it and fails the job with its exit status, so the other lint checks
      # run meanwhile instead of queueing behind it (#2050).
      - name: Start DDD Dependency Impact Report
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          base_sha="${BASE_SHA:-}"
          head_sha="${HEAD_SHA:-}"
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || git rev-parse HEAD^)"
          fi

          uv run --with pydantic python tools/generate_consumer_proofs.py --output "$RUNNER_TEMP/consumer-proofs.json"
          {
            set +e
            uv run --with pydantic python tools/report_ddd_dependencies.py \
              --base-ref "$base_sha" \
              --fail-on-breaking \
              --consumer-proofs "$RUNNER_TEMP/consumer-proofs.json" \
              --json-out "$RUNNER_TEMP/ddd-dependency-report.json" \
              --governance-observations-out "$RUNNER_TEMP/ddd-governance-observations.json" \
              --markdown-out "$RUNNER_TEMP/DDD-DEPENDENCY-REPORT.md"
            echo "$?" > "$RUNNER_TEMP/ddd-dependency-report.exit.tmp"
            mv "$RUNNER_TEMP/ddd-dependency-report.exit.tmp" "$RUNNER_TEMP/ddd-dependency-report.exit"
          } > "$RUNNER_TEMP/ddd-dependency-report.log" 2>&1 &
      # Fast-fail (left-move): these SSOT/contract gates are app-independent
      # (`uv run --with pyyaml[--with pydantic]`, no backend sync / npm) and are
      # the drift classes behind most CI failures. Running them BEFORE the
      # expensive `uv sync` + `npm ci` means a drift fails in ~20s instead of
      # after ~50s of setup. Same checks, no coverage change; ordering only.
      # Contract-loading gates need `pydantic`: the manifest gate projects
      # package concepts (#1799), while the AC-index gate projects package AC
      # vision anchors (#1858). Both remain isolated `--with` overlays rather
      # than a full backend `uv sync`.
      - name: SSOT Manifest Check
        run: |
          uv run --with pyyaml --with pydantic python tools/check_manifest.py
      - name: SSOT Governance Exceptions Check
        run: |
          uv run --with pyyaml python tools/check_governance_exceptions.py
      - name: SSOT Governance Report
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          base_sha="${BASE_SHA:-}"
          head_sha="${HEAD_SHA:-}"

          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || git rev-parse HEAD^)"
          fi

          if ! git diff --name-only "$base_sha...$head_sha" > "$RUNNER_TEMP/ssot-changed-files.txt"; then
            git diff --name-only "$base_sha" "$head_sha" > "$RUNNER_TEMP/ssot-changed-files.txt"
          fi

          # --with pydantic (#1799): report_ssot_governance.py's finance_report
          # source now routes through check_manifest.py's computed union,
          # which loads package contracts (pydantic-backed PackageContract).
          uv run --with pyyaml --with pydantic python tools/report_ssot_governance.py \
            --changed-files "$RUNNER_TEMP/ssot-changed-files.txt" \
            --base-ref "$base_sha" \
            --fail-on-gate \
            --json-out "$RUNNER_TEMP/ssot-governance-report.json" \
            --markdown-out "$RUNNER_TEMP/SSOT-GOVERNANCE-REPORT.md"
          cat "$RUNNER_TEMP/SSOT-GOVERNANCE-REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Migration Risk Contract Check
        run: |
          uv run --with pyyaml python tools/check_migration_risk.py
      - name: CI Metrics Contract Check
        run: |
          uv run --with pyyaml python tools/check_ci_metrics_contract.py
      - name: Workflow Contract Check
        run: |
          uv run --with pyyaml python tools/check_workflow_contract.py
      - name: Cache Python venv
        uses: actions/cache@v5
        with:
          path: apps/backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('apps/backend/uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-
      - name: Install dependencies
        run: cd apps/backend && uv sync
      - name: Run Lint
        run: |
          cd apps/backend
          uv run ruff check src tests
          uv run ruff format src tests --check
      - name: Detached Owner Shortcut Guard
        run: |
          uv run python tools/check_detached_owner_shortcuts.py
      - name: Router Contract Maturity Guard
        run: |
          uv run python tools/audit_router_contracts.py --check
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend
      - name: Audit frontend production dependencies
        run: npm run audit:prod
        working-directory: apps/frontend
      - name: Run Frontend Lint
        run: npm run lint
        working-directory: apps/frontend
      - name: Doc Consistency Check
        run: |
          uv run --with pyyaml python tools/lint_doc_consistency.py
      - name: Generated API Reference Check
        run: |
          cd apps/backend
          uv run python ../../tools/generate_api_reference.py --check
      - name: EPIC Status Pointer Check
        run: |
          # The EPIC-status numbers are a derived (not committed) view of the AC
          # graph; this only verifies the README pointer block is intact, never a
          # shifted AC total.
          uv run --with pyyaml python tools/generate_epic_status.py --check
      - name: Generated DB Schema Reference Check
        run: |
          cd apps/backend
          uv run python ../../tools/generate_db_schema_reference.py
          uv run python ../../tools/generate_db_schema_reference.py --check
      - name: AC Index Consistency Check
        run: |
          # The SINGLE AC-index gate, exactly TWO gates over the AC-keyed graph:
          # A) INTEGRITY (hard) — every AC managed + no dangling link, PLUS the
          #    two folded former-standalone contracts: CI-stage traceability
          #    (mandatory ACs must resolve to a real ref in a CI-required stage,
          #    with placeholder/stub/unexecuted classifications) and the
          #    critical-proof matrix contract (trust_mode/mirror/markers/scope/
          #    ci_tier/manual-gate evidence + macro-outcome shape). The old
          #    check_ac_traceability / check_critical_proof_matrix gate STEPS are
          #    retired; their logic runs here by importing them as libraries.
          # B) PROTECTION RATCHET — per-type count floor over protection-floor.json
          #    (the per-AC score floor runs in the ac-behavioral-ratchet job).
          uv run --with pyyaml --with pydantic python tools/check_ac_index.py
      - name: AC Authority-Tier Ratchet
        run: |
          # EPIC-026: shrink-only ratchet over common/meta/data/ac-tier-baseline.json.
          # Id-based: fails only when an AC whose id is absent from the baseline
          # (a genuinely new AC) lacks a {tier:XX} marker; the legacy untagged AC
          # ids in the baseline are tolerated and the debt may only shrink.
          uv run --with pyyaml python tools/check_ac_tier_baseline.py
      - name: AC Proof-Kind Matrix Enforcement
        run: |
          # EPIC-026 phase 2: enforce the tier->valid-proof-kind matrix
          # (common/meta/readme.md) for ACs that carry a {tier:XX}.
          # Untagged legacy ACs have no proof_kind and are ignored (non-breaking).
          # The rule with teeth: an LLM-LED AC's proof_kind MUST NOT be `exact`
          # (an LLM-emitted output cannot be proven by an exact golden assertion);
          # HU must be `evidence`; LLM-ONLY must not be exact.
          uv run --with pyyaml python tools/check_ac_proof_kind.py
      - name: Package-Model Migration-Safety Gates
        run: |
          # EPIC-026 phase 5 (#1355) & #2133: consolidated package-model migration safety
          # and contract gates (tier AST literal, dual definition, draft registration,
          # authority reconcile, gate main contract, baseline update contract, tool shim contract).
          uv run --with pyyaml python tools/check_package_migration_safety.py
      - name: Tier Import Guard (CODE-ONLY must not import the LLM layer)
        run: |
          # EPIC-026 phase 3: enforce the cross-tier STRUCTURAL MUST rule
          # (common/meta/readme.md, rule 2 "CODE-ONLY stays pure"). AST-based,
          # direct-imports-only: a curated set of CODE-ONLY/financial-truth modules
          # (money/**, ledger/**, journal model, deterministic services) must
          # not import the LLM layer (src.llm) or a raw provider SDK
          # (litellm/openrouter/anthropic/openai). GREEN on main today; this is a
          # regression guard that keeps the deterministic core pure.
          python tools/check_tier_imports.py
      - name: LLM Cassette Integrity (balance-chain invariant)
        run: |
          # EPIC-023 AC23.7 / #1306-7: every committed statement-extraction
          # cassette must satisfy opening + Σ amounts ≈ closing (Decimal). A
          # re-recorded cassette where the LLM drifted into an inconsistent
          # extraction fails here. Pure Python (no key/network/DB), so it runs in
          # lint without touching the AC behavioral-score aggregator.
          python tools/check_llm_cassettes.py
      - name: LLM Cassette Graded Eval (field-accuracy drift ratchet)
        run: |
          # EPIC-023 AC23.8 / #1307: GRADED field-accuracy eval over committed
          # cassettes. AC23.7 above gates CONSISTENCY (the chain reconciles); this
          # gates ACCURACY — each cassette is scored per-field against a synthetic
          # ground truth and ratcheted against a per-case floor that only goes UP.
          # Fails when a refreshed cassette regresses below floor (incl. "balance
          # passes but a field is wrong"). Pure Python (no key/network/DB), so it
          # runs in lint without touching the AC behavioral-score aggregator.
          python tools/check_cassette_graded_eval.py
      - name: SSOT Ownership Lint
        run: |
          python tools/check_ssot_ownership.py --verbose
      - name: DDD Dependency Impact Report
        run: |
          for _ in {1..540}; do
            if [ -f "$RUNNER_TEMP/ddd-dependency-report.exit" ]; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ddd-dependency-report.log"
          if [ -f "$RUNNER_TEMP/DDD-DEPENDENCY-REPORT.md" ]; then
            cat "$RUNNER_TEMP/DDD-DEPENDENCY-REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ! -f "$RUNNER_TEMP/ddd-dependency-report.exit" ]; then
            echo "::error::DDD dependency report did not finish"
            exit 1
          fi
          exit "$(cat "$RUNNER_TEMP/ddd-dependency-report.exit")"
      - name: Publish DDD governance observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ddd-governance-observations
          path: ${{ runner.temp }}/ddd-governance-observations.json
          if-no-files-found: warn
          retention-days: 14
      - name: PR Review Thread Merge Gate
        # Issue #755 (scope 2a): block merge while an unresolved P0/P1 (or
        # unresolved Copilot-authored) review thread is open. Skips cleanly on
        # non-PR events because PR_NUMBER is empty (the checker exits 0).
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python tools/check_pr_review_threads.py

  schema-migrations:
    name: Schema Migration Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.pr_required == 'true'

    services:
      postgres:
        image: postgres:15.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_report_test
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend-env
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Alembic migration contract
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/finance_report_test
        run: |
          set -euo pipefail
          cd apps/backend
          mkdir -p test-results ci-context
          {
            echo "Schema Migration Context"
            echo "========================"
            echo "repository=${{ github.repository }}"
            echo "event_name=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "database=finance_report_test"
            echo "proof=alembic-upgrade-head-plus-alembic-check"
          } > ci-context/schema-migration-context.txt
          {
            echo "[schema-migration] uv run alembic upgrade head"
            uv run alembic upgrade head
            echo "[schema-migration] uv run alembic check"
            uv run alembic check
          } 2>&1 | tee test-results/schema-migration.log

      - name: Upload schema migration test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: schema-migration-test-context
          path: |
            apps/backend/test-results/schema-migration.log
            apps/backend/ci-context/schema-migration-context.txt
          retention-days: 14
  backend:
    name: Backend Tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.pr_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_report_test
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend-env
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}



      - name: Run Tests (Shard ${{ matrix.shard }}/4)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/finance_report_test
          S3_ACCESS_KEY: minio
          S3_SECRET_KEY: minio_local_secret
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: statements
          ENABLE_STORAGE_SWEEP: "false"
        run: |
          cd apps/backend
          mkdir -p test-results
          python - <<'PY'
          import json
          from pathlib import Path

          seed = Path("ci/backend-test-durations.json")
          if not seed.exists():
              raise SystemExit(f"pytest-split duration seed is missing: {seed}")
          durations = json.loads(seed.read_text(encoding="utf-8"))
          if len(durations) < 500:
              raise SystemExit(
                  f"pytest-split duration seed is too small: {len(durations)} entries"
              )
          print(f"Loaded pytest-split duration seed with {len(durations)} entries")
          PY
          # File-level seeded split (common/testing/backend_shard.py): the same
          # least_duration rule pytest-split applies to items, applied to whole
          # test files, so this shard collects only its own files instead of
          # importing the entire suite under --cov-branch to keep an assigned slice of
          # it (that collection alone was 37-58 s per shard, #2050). Every
          # tests/**/test_*.py file lands in exactly one shard.
          python ../../tools/backend_shard_files.py \
            --splits 4 \
            --group ${{ matrix.shard }} \
            --splitting-algorithm=least_duration \
            --durations-path ci/backend-test-durations.json \
            > "$RUNNER_TEMP/backend-shard-tests.txt"
          BACKEND_SHARD_TESTS=()
          while IFS= read -r test_file; do
            BACKEND_SHARD_TESTS+=("$test_file")
          done < "$RUNNER_TEMP/backend-shard-tests.txt"
          if [ "${#BACKEND_SHARD_TESTS[@]}" -eq 0 ]; then
            echo "::error::backend shard ${{ matrix.shard }}/4 selected no test files"
            exit 1
          fi
          echo "Shard ${{ matrix.shard }}/4 runs ${#BACKEND_SHARD_TESTS[@]} test files"
          uv run pytest -n auto -v \
            -m "not slow and not e2e and not integration" \
            --cov=src \
            --cov-report=lcov:coverage-backend-${{ matrix.shard }}.lcov \
            --cov-report=term-missing \
            --cov-branch \
            --cov-fail-under=0 \
            --dist worksteal \
            --junit-xml=test-results/backend-shard-${{ matrix.shard }}.xml \
            "${BACKEND_SHARD_TESTS[@]}"

      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend-${{ matrix.shard }}
          path: apps/backend/coverage-backend-${{ matrix.shard }}.lcov
          retention-days: 14

      - name: Upload backend shard test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-shard-${{ matrix.shard }}-test-context
          path: |
            apps/backend/test-results/backend-shard-${{ matrix.shard }}.xml
            apps/backend/test-results/served-cassettes*.txt
            apps/backend/coverage-backend-${{ matrix.shard }}.lcov
          retention-days: 14

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.pr_required == 'true'

    services:
      postgres:
        image: postgres:15.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_report_test
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      # Started in the background right after checkout, so the image pulls
      # and the MinIO boot overlap uv/Python/venv setup instead of queueing
      # behind it. "Wait for MinIO" blocks on the outcome before any
      # test runs, and a setup failure still fails the job there.
      - name: Start MinIO
        run: |
          cat > "$RUNNER_TEMP/start-minio.sh" <<'SH'
          set -euo pipefail
          docker run -d \
            --name finance-report-minio-integration \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio_local_secret \
            cgr.dev/chainguard/minio:latest-dev@sha256:4b862594d23cb20ae0fbeb93311ed312a5b566ecba2293220b204c89ef3c1fe2 \
            server /data --console-address ":9001"
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live
          docker run --rm --network host --entrypoint /bin/sh cgr.dev/chainguard/minio-client:latest-dev@sha256:614e083a12c6dc779f13f97e01b13afda4021a8ce3f4021a2fcf23ec86f46837 \
            -c 'mc alias set local http://127.0.0.1:9000 minio minio_local_secret && mc mb local/statements --ignore-existing'
          SH
          {
            if bash "$RUNNER_TEMP/start-minio.sh"; then
              touch "$RUNNER_TEMP/minio-ready"
            else
              touch "$RUNNER_TEMP/minio-failed"
            fi
          } > "$RUNNER_TEMP/minio-setup.log" 2>&1 &

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend-env
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      # #1828 G-health-honest-somewhere: this lane runs the REAL Bootloader
      # _check_database/_check_s3 (tests/integration/test_bootloader_real_checks.py),
      # so it needs a live S3-compatible service, not just the env vars.
      - name: Wait for MinIO
        run: |
          for _ in {1..120}; do
            if [ -f "$RUNNER_TEMP/minio-ready" ] || [ -f "$RUNNER_TEMP/minio-failed" ]; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/minio-setup.log"
          test -f "$RUNNER_TEMP/minio-ready"

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/finance_report_test
          S3_ACCESS_KEY: minio
          S3_SECRET_KEY: minio_local_secret
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: statements
          ENABLE_STORAGE_SWEEP: "false"
        run: |
          cd apps/backend
          mkdir -p test-results
          uv run pytest -n auto -v \
            --override-ini addopts="" \
            -m "integration" \
            --dist worksteal \
            --junit-xml=test-results/backend-integration.xml

      - name: Upload backend integration test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-test-context
          path: |
            apps/backend/test-results/backend-integration.xml
            apps/backend/test-results/served-cassettes*.txt
          retention-days: 14

      - name: Stage Contribution Summary (Behavioral proof only)
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Backend Integration Stage
          - Scope: `-m "integration"` backend suites
          - Contribution: behavior proof channel only
          - Coverage effect: **not included** in unified line coverage baseline for now
          EOF

  backend-e2e-tier1:
    name: Backend Tier-1 API E2E (Shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.pr_required == 'true'
    # Seeded 3-way least_duration split (ci/backend-tier1-test-durations.json):
    # four statement-corpus journeys take 38-55 s each, so one 2-worker job was
    # the slowest leg of the PR pipeline (152 s of tests, #2050).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:15.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_report_test
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      # Started in the background right after checkout, so the image pulls
      # and the MinIO boot overlap uv/Python/venv setup instead of queueing
      # behind it. "Wait for MinIO" blocks on the outcome before any
      # test runs, and a setup failure still fails the job there.
      - name: Start MinIO
        run: |
          cat > "$RUNNER_TEMP/start-minio.sh" <<'SH'
          set -euo pipefail
          docker run -d \
            --name finance-report-minio-tier1 \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio_local_secret \
            cgr.dev/chainguard/minio:latest-dev@sha256:4b862594d23cb20ae0fbeb93311ed312a5b566ecba2293220b204c89ef3c1fe2 \
            server /data --console-address ":9001"
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live
          docker run --rm --network host --entrypoint /bin/sh cgr.dev/chainguard/minio-client:latest-dev@sha256:614e083a12c6dc779f13f97e01b13afda4021a8ce3f4021a2fcf23ec86f46837 \
            -c 'mc alias set local http://127.0.0.1:9000 minio minio_local_secret && mc mb local/statements --ignore-existing'
          SH
          {
            if bash "$RUNNER_TEMP/start-minio.sh"; then
              touch "$RUNNER_TEMP/minio-ready"
            else
              touch "$RUNNER_TEMP/minio-failed"
            fi
          } > "$RUNNER_TEMP/minio-setup.log" 2>&1 &

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend-env
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Wait for MinIO
        run: |
          for _ in {1..120}; do
            if [ -f "$RUNNER_TEMP/minio-ready" ] || [ -f "$RUNNER_TEMP/minio-failed" ]; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/minio-setup.log"
          test -f "$RUNNER_TEMP/minio-ready"

      - name: Run Tier-1 API E2E Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/finance_report_test
          S3_ACCESS_KEY: minio
          S3_SECRET_KEY: minio_local_secret
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: statements
          ENABLE_STORAGE_SWEEP: "false"
        run: |
          cd apps/backend
          mkdir -p test-results
          pytest_extra_args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pytest_extra_args+=(--maxfail=1)
          fi
          # -n auto/--dist worksteal (as the `backend` shards already use against
          # these same services): the 59 tests here have no shared-state hazard --
          # tests/conftest.py's worker_id/get_test_db_url fixtures already give
          # each xdist worker its own Postgres database (truncated per test), S3
          # object keys are namespaced by statement UUID (build_statement_storage_key),
          # and the LLM-cassette-served log is written per-PID
          # (test-results/served-cassettes-<pid>.txt), so this was serial only
          # because it predated -n auto here, not because it needs to be serial.
          uv run pytest -v \
            --override-ini addopts="" \
            tests/e2e/test_core_journeys.py \
            tests/e2e/test_seeded_statement_journey.py \
            tests/e2e/test_statement_corpus_journeys.py \
            tests/e2e/test_epic025_dry_ssot_e2e.py \
            -m "e2e and not slow and not integration and not perf" \
            --splits 3 \
            --group ${{ matrix.shard }} \
            --splitting-algorithm=least_duration \
            --durations-path ci/backend-tier1-test-durations.json \
            -n auto --dist worksteal \
            "${pytest_extra_args[@]}" \
            --junit-xml=test-results/backend-tier1-e2e.xml

      - name: Upload backend Tier-1 E2E test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-tier1-e2e-${{ matrix.shard }}-test-context
          path: |
            apps/backend/test-results/backend-tier1-e2e.xml
            apps/backend/test-results/served-cassettes*.txt
          retention-days: 14

      - name: Stage Contribution Summary (Behavioral proof only)
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Backend Tier-1 API E2E Stage
          - Scope: `tests/e2e/test_core_journeys.py` with `-m "e2e and not slow and not integration and not perf"`
          - Contribution: behavior proof channel only
          - Coverage effect: **not included** in unified line coverage baseline for now
          EOF

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    # AC-testing.ci-structure.11: right-moved off PRs that touch no
    # apps/frontend/** path, mirroring frontend-telemetry-e2e's
    # frontend_changed gate (#1689) -- this job's proof (typecheck + prod
    # build) is not coverage-scoped, so narrowing it costs nothing unified-
    # coverage depends on.
    if: needs.changes.outputs.pr_required == 'true' && needs.changes.outputs.frontend_changed == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Cache Next.js
        uses: actions/cache@v5
        with:
          path: apps/frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-${{ hashFiles('apps/frontend/**/*.ts', 'apps/frontend/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Run Frontend Type Check
        run: npm run typecheck
        working-directory: apps/frontend

      - name: Build Frontend
        run: npm run build
        working-directory: apps/frontend

  frontend-vitest:
    name: Frontend Vitest Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.pr_required == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Run Frontend Tests
        run: |
          mkdir -p test-results
          npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-junit.xml
        working-directory: apps/frontend

      - name: Upload frontend coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: apps/frontend/coverage/lcov.info
          retention-days: 14

      - name: Upload frontend Vitest test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-vitest-test-context
          path: |
            apps/frontend/test-results/
            apps/frontend/coverage/lcov.info
          retention-days: 14

  frontend-playwright:
    name: Frontend Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    # AC-testing.ci-structure.11: right-moved off PRs that touch no
    # apps/frontend/** path, mirroring frontend-telemetry-e2e's
    # frontend_changed gate (#1689) -- this job's proof (provider-free
    # browser E2E) is not coverage-scoped, so narrowing it costs nothing
    # unified-coverage depends on. Unlike frontend-telemetry-e2e it is not a
    # production observability canary, so (like backend/frontend-build) it
    # gates on pr_required uniformly with no always-run-on-push override
    # (AC-testing.deploy-gates.25).
    if: needs.changes.outputs.pr_required == 'true' && needs.changes.outputs.frontend_changed == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Cache Next.js
        uses: actions/cache@v5
        with:
          path: apps/frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-${{ hashFiles('apps/frontend/**/*.ts', 'apps/frontend/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Build Frontend
        run: npm run build
        working-directory: apps/frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Frontend Playwright Browser
        # #1767: retry a transient toolchain download (network flake on the
        # ~400MB chromium fetch) with bounded exponential backoff, mirroring
        # .github/actions/setup-e2e-tests's retry_download idiom. Cached above,
        # so a warm cache skips the download and this step is a fast no-op.
        run: |
          set -uo pipefail
          attempts=3
          delay=10
          for n in $(seq 1 "$attempts"); do
            echo "::group::playwright install chromium (attempt ${n}/${attempts})"
            if npx playwright install chromium --with-deps; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$n" -lt "$attempts" ]; then
              echo "playwright install attempt ${n} failed; retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::playwright install chromium failed after ${attempts} attempts."
          exit 1
        working-directory: apps/frontend

      - name: Run Frontend Playwright Tests
        run: npm run test:e2e -- --reporter=line,html
        working-directory: apps/frontend

      - name: Upload frontend Playwright test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-test-context
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          retention-days: 14

  frontend-telemetry-e2e:
    name: Frontend Telemetry E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    # #1689: right-moved off unrelated PRs (browser install is ~2-3 min). Always
    # runs on main/release push and manual dispatch (this is the production
    # observability canary); on a PR it only runs when apps/frontend/** changed,
    # mirroring container-images' image_build_required pattern above.
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))
      || github.event_name == 'workflow_dispatch'
      || (needs.changes.outputs.pr_required == 'true' && needs.changes.outputs.frontend_changed == 'true')

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Cache Next.js
        uses: actions/cache@v5
        with:
          path: apps/frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-${{ hashFiles('apps/frontend/**/*.ts', 'apps/frontend/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Build Frontend
        run: npm run build
        working-directory: apps/frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Frontend Playwright Browser
        # #1767: retry a transient toolchain download (network flake on the
        # ~400MB chromium fetch) with bounded exponential backoff, mirroring
        # .github/actions/setup-e2e-tests's retry_download idiom. Cached above,
        # so a warm cache skips the download and this step is a fast no-op.
        run: |
          set -uo pipefail
          attempts=3
          delay=10
          for n in $(seq 1 "$attempts"); do
            echo "::group::playwright install chromium (attempt ${n}/${attempts})"
            if npx playwright install chromium --with-deps; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$n" -lt "$attempts" ]; then
              echo "playwright install attempt ${n} failed; retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::playwright install chromium failed after ${attempts} attempts."
          exit 1
        working-directory: apps/frontend

      - name: Run Frontend Telemetry-Emission E2E (#1169 / EPIC-024 AC24.2)
        # Real-browser proof that browser OTel spans export to /v1/traces and
        # OpenPanel events dispatch. Runs under its own config because it injects
        # the OTel + OpenPanel config via webServer.env (hermetic: every
        # telemetry destination is intercepted in-test).
        run: npm run test:e2e:telemetry
        working-directory: apps/frontend

      - name: Upload frontend telemetry E2E test context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-telemetry-test-context
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          retention-days: 14

  container-images:
    name: Build Staging Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    # Main/release push (and manual dispatch) ALWAYS build + push the immutable
    # per-commit :<sha> image: the Dockerfiles COPY app source into the image, so
    # every commit's image content differs, and promote-not-rebuild (deploy_v2
    # release) requires a :<sha> artifact for any releasable commit. A build-context
    # gate alone (image_build_required) leaves source-only / submodule-only commits
    # with no :<sha> image to promote. PR keeps the narrow build-context-only
    # dry-run for speed (no push happens on PRs anyway).
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))
      || github.event_name == 'workflow_dispatch'
      || (needs.changes.outputs.pr_required == 'true' && needs.changes.outputs.image_build_required == 'true')
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Get Commit SHA
        id: get_sha
        run: |
          full_sha=$(git rev-parse HEAD)
          short_sha="${full_sha:0:7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "Building staging images for commit: $short_sha"

      - name: Build-context Secret Scan (gitleaks)
        uses: ./.github/actions/gitleaks-scan
        with:
          source: apps/${{ matrix.component }}

      - name: Log in to Container registry
        # P1a (#879, AC7.12.4): publish :<sha> for main + release-branch commits, and
        # on demand via workflow_dispatch (the rare "preview an unmerged sha" escape hatch).
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend SHA image
        if: matrix.component == 'backend'
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend
          push: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || github.event_name == 'workflow_dispatch' }}
          # Plain single-manifest image: provenance/sbom attestations turn the push
          # into an OCI index that legacy (non-containerd) docker hosts choke on when
          # pulling. Keep images plainly pullable everywhere.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.get_sha.outputs.short_sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ steps.get_sha.outputs.short_sha }}

      - name: Build Frontend SHA image
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@v7
        with:
          context: ./apps/frontend
          push: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || github.event_name == 'workflow_dispatch' }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.get_sha.outputs.short_sha }}
          # G1 (#898, AC7.12.8): the published :<sha> image must be environment-independent.
          # Do NOT bake NEXT_PUBLIC_API_URL or NEXT_PUBLIC_APP_URL here — the front end uses
          # the same-origin relative /api path, so one image promotes unchanged across
          # staging and prod.
          build-args: |
            GIT_COMMIT_SHA=${{ steps.get_sha.outputs.short_sha }}

  verify-sha-image-published:
    name: Verify Commit Image Published
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [container-images]
    # #1759 (W4 of #1435): "every main commit produces a promotable :<sha>"
    # was previously guaranteed only by design (container-images always
    # builds+pushes on main push) — nothing verified the guarantee actually
    # held for a given commit. A push where the build step reports success
    # but the image never lands in the registry would only surface later, at
    # promote time. This job independently re-inspects the registry (not
    # trusting the build step's own self-report) immediately after the
    # build, so a violation is caught at commit time. container-images
    # always runs on main push (see its own if:), so needs: alone is enough
    # to gate this on that job's success.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get Commit SHA
        id: get_sha
        run: |
          full_sha=$(git rev-parse HEAD)
          short_sha="${full_sha:0:7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Log in to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify :<sha> images exist in registry
        run: |
          set -euo pipefail
          python tools/verify_release_images.py \
            --registry "${{ env.REGISTRY }}" \
            --image-prefix "${{ env.IMAGE_PREFIX }}" \
            --version-ref "${{ steps.get_sha.outputs.short_sha }}"

  tooling-coverage:
    name: Tooling/Common Coverage (Shard ${{ matrix.shard }}/2)
    needs: [changes]
    if: needs.changes.outputs.pr_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Set up backend environment
        uses: ./.github/actions/setup-backend-env
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run tooling tests with coverage
        run: |
          # tests/tooling/ needs exactly what apps/backend already declares
          # (pytest/pytest-cov/pytest-xdist/pytest-asyncio, pydantic, sqlalchemy,
          # asyncpg, fastapi, httpx, pdfplumber, reportlab, boto3, pyyaml,
          # structlog, email-validator, anyio transitively, infra2-sdk) -- so
          # this job installs from the SAME lockfile-backed venv/cache the
          # backend/backend-integration/backend-e2e-tier1 jobs already warm
          # (actions/cache@v5 on apps/backend/uv.lock), instead of an ad hoc
          # `uv run --with <17 packages>` resolve+download every run (#1767
          # measured that ad hoc install at ~7:47-7:59 of the former single-job's
          # ~8:00 total).
          sdk_pin="$(python tools/sdk_pin.py)" || exit $?
          read -r sdk_url sdk_sha256 sdk_filename <<< "$sdk_pin"
          sdk_wheel="$RUNNER_TEMP/$sdk_filename"
          curl --fail --location --silent --show-error "$sdk_url" --output "$sdk_wheel"
          printf '%s  %s\n' "$sdk_sha256" "$sdk_wheel" | sha256sum --check --status
          # Prove the pinned wheel actually installs (the SDK pin CLI boundary
          # restored by #2004/#2036/#2038) -- now into the synced venv rather
          # than a throwaway `uv run --with` environment. --no-deps: infra2-sdk's
          # runtime dependency is already satisfied by `uv sync` (apps/backend/uv.lock),
          # so this stays a pure install-the-pinned-wheel proof, never a network
          # resolve that could reintroduce variable install time.
          uv pip install --no-deps --python apps/backend/.venv/bin/python "$sdk_wheel"
          mkdir -p coverage
          printf '[run]\nomit =\n    tests/tooling/*\n    common/__init__.py\n    common/**/__init__.py\n    tools/__init__.py\n    tools/**/__init__.py\n    tools/wait_for_cheap_ci.py\n    common/testing/wait_for_cheap_ci.py\n    tools/_lib/benchmarks/*\n    tools/run_financial_scenario_benchmark.py\n    tools/generate_benchmark_index.py\n    tools/sync_benchmark_fixtures.py\n' > /tmp/tooling-coveragerc
          # PR pipeline speedup (#2047): the ~490-510s single-job test run
          # (already parallelized -n auto -- #1767) is itself the bottleneck once
          # its ad hoc install tax is gone. Sharded with the same seeded
          # pytest-split least_duration algorithm the `backend` shards use, so
          # each shard collects+runs only its slice instead of the full suite.
          python - <<'PY'
          import json
          from pathlib import Path

          seed = Path("ci/tooling-test-durations.json")
          if not seed.exists():
              raise SystemExit(f"pytest-split duration seed is missing: {seed}")
          durations = json.loads(seed.read_text(encoding="utf-8"))
          if len(durations) < 500:
              raise SystemExit(
                  f"pytest-split duration seed is too small: {len(durations)} entries"
              )
          print(f"Loaded pytest-split duration seed with {len(durations)} entries")
          PY
          apps/backend/.venv/bin/python -m pytest tests/tooling/ \
            --splits 2 \
            --group ${{ matrix.shard }} \
            --splitting-algorithm=least_duration \
            --durations-path ci/tooling-test-durations.json \
            --cov=common \
            --cov=tools \
            --cov=apps/backend/src \
            --cov-config=/tmp/tooling-coveragerc \
            --cov-report= \
            --junit-xml=coverage/tooling-junit-${{ matrix.shard }}.xml \
            -n auto -x -q
          COVERAGE_RCFILE=/tmp/tooling-coveragerc apps/backend/.venv/bin/python -m coverage lcov -o coverage/common-${{ matrix.shard }}.lcov --include='common/*'
          COVERAGE_RCFILE=/tmp/tooling-coveragerc apps/backend/.venv/bin/python -m coverage lcov -o coverage/tools-${{ matrix.shard }}.lcov --include='tools/*'
          # #1669 moved env_keys.py/schema_validation.py from common/config into
          # apps/backend/src/runtime/extension/, so they now belong to the
          # "backend" coverage bucket. Their only test suite is tests/tooling/
          # (they must stay importable in this minimal env), which the Backend
          # Tests job never runs — so measure them here and merge into
          # backend.lcov instead, rather than letting them show as uncovered.
          # The report must be generated with cwd=apps/backend (matching how
          # the Backend Tests shards run `--cov=src`) so the emitted SF: paths
          # (src/runtime/...) match the shards' paths exactly — otherwise
          # merge_lcov.py treats them as distinct files and double-counts lines.
          (cd apps/backend && COVERAGE_RCFILE=/tmp/tooling-coveragerc .venv/bin/python -m coverage lcov \
            --data-file="$GITHUB_WORKSPACE/.coverage" \
            -o "$GITHUB_WORKSPACE/coverage/backend-tooling-${{ matrix.shard }}.lcov" \
            --include='src/runtime/extension/env_keys.py,src/runtime/extension/schema_validation.py')

      - name: Upload tooling coverage shard context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-tooling-${{ matrix.shard }}
          path: |
            coverage/common-${{ matrix.shard }}.lcov
            coverage/tools-${{ matrix.shard }}.lcov
            coverage/backend-tooling-${{ matrix.shard }}.lcov
            coverage/tooling-junit-${{ matrix.shard }}.xml
          retention-days: 14

  tooling-coverage-merge:
    name: Tooling/Common Coverage
    needs: [changes, tooling-coverage]
    if: needs.changes.outputs.pr_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download tooling coverage shards
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-tooling-*
          merge-multiple: true
          path: coverage-tooling-shards

      - name: Merge tooling coverage
        run: |
          mkdir -p coverage
          python tools/merge_lcov.py coverage/common.lcov coverage-tooling-shards/common-*.lcov
          python tools/merge_lcov.py coverage/tools.lcov coverage-tooling-shards/tools-*.lcov
          python tools/merge_lcov.py coverage/backend-tooling.lcov coverage-tooling-shards/backend-tooling-*.lcov
          # JUnit has no numeric union to compute (unlike LCOV): concatenate
          # every shard's <testsuite> under one <testsuites> root so the
          # combined coverage-tooling artifact still carries exactly one
          # tooling-junit.xml, byte-equivalent in content (all 8 shards' cases)
          # to what the single un-sharded job used to emit.
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          shard_dir = Path("coverage-tooling-shards")
          xml_paths = sorted(shard_dir.glob("tooling-junit-*.xml"))
          if not xml_paths:
              raise SystemExit("no per-shard tooling-junit-*.xml files found to merge")

          merged_root = ElementTree.Element("testsuites")
          for path in xml_paths:
              root = ElementTree.parse(path).getroot()
              merged_root.extend([root] if root.tag == "testsuite" else list(root))

          Path("coverage").mkdir(exist_ok=True)
          ElementTree.ElementTree(merged_root).write(
              "coverage/tooling-junit.xml", encoding="utf-8", xml_declaration=True
          )
          print(f"Merged {len(xml_paths)} shard junit files into coverage/tooling-junit.xml")
          PY

      - name: Upload tooling coverage context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-tooling
          path: |
            coverage/common.lcov
            coverage/tools.lcov
            coverage/backend-tooling.lcov
            coverage/tooling-junit.xml
          retention-days: 14

  unified-coverage:
    name: Calculate Unified Coverage
    needs: [changes, backend, frontend-vitest, tooling-coverage-merge]
    if: needs.changes.outputs.pr_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # #1810: the diff coverage gate needs history to resolve the
          # merge-base against the PR base branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download backend coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-backend-*
          merge-multiple: true
          path: coverage-backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: coverage-frontend

      - name: Download tooling coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-tooling
          path: coverage-tooling

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          backend_inputs=()
          if ls coverage-backend/*.lcov 1> /dev/null 2>&1; then
            backend_inputs+=(coverage-backend/*.lcov)
          fi
          if [ -f coverage-tooling/backend-tooling.lcov ]; then
            backend_inputs+=(coverage-tooling/backend-tooling.lcov)
          fi
          if [ ${#backend_inputs[@]} -gt 0 ]; then
            python tools/merge_lcov.py coverage/backend.lcov "${backend_inputs[@]}"
          else
            echo "No backend coverage found"
          fi
          if [ -f coverage-frontend/lcov.info ]; then
            cp coverage-frontend/lcov.info coverage/frontend.lcov
          else
            echo "No frontend coverage found"
          fi
          if [ -f coverage-tooling/common.lcov ]; then
            cp coverage-tooling/common.lcov coverage/common.lcov
          else
            echo "No common coverage found"
          fi
          if [ -f coverage-tooling/tools.lcov ]; then
            cp coverage-tooling/tools.lcov coverage/tools.lcov
          else
            echo "No tools coverage found"
          fi

      # #1810 (G-diff-coverage): on PRs, the BLOCKING coverage verdict is
      # diff-scoped — changed/added lines in governed source trees must be
      # covered at or above the threshold (default 85%), and a red verdict
      # names the uncovered file:line ranges. Deterministic per PR, no
      # baseline, no epsilon, locally reproducible from the tests the author
      # is already running (tools/check_diff_coverage.py).
      - name: Diff coverage gate (PR)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "$GITHUB_BASE_REF"
          python tools/check_diff_coverage.py --base "origin/$GITHUB_BASE_REF"

      - name: Audit coverage policy
        run: |
          python tools/check_coverage_policy.py

      - name: Calculate unified coverage
        # Lenient by design: the merge step above deliberately tolerates a
        # coverage-producing shard that did not upload an artifact on this PR
        # (it echoes "No <component> coverage found" instead of failing). The
        # artifact preflight (#414) is therefore opt-in here — we do NOT pass
        # --require-artifacts / COVERAGE_REQUIRED_COMPONENTS, so a legitimately
        # absent artifact is reported (as 0% for the missing component) rather
        # than hard-aborting this always-run gate.
        #
        # #1810: on a PR the component-% ratchet is REPORT-ONLY — a detected
        # baseline regression is printed in this step's output but does not
        # fail the job; the blocking PR coverage verdict is the diff coverage
        # gate step above. Main pushes run in "block" mode: the ratchet stays
        # the main-only no-regression water-line, and the raise-only baseline
        # floor (unified-coverage-baseline-pr) is unchanged.
        #
        # #1689 (still active for the report): the scoped gate-components list
        # names which components' regressions are attributed to THIS PR in the
        # report; main-branch push always evaluates the full unscoped set (env
        # unset here).
        env:
          COVERAGE_GATE_COMPONENTS: ${{ github.event_name == 'pull_request' && needs.changes.outputs.coverage_gate_components || '' }}
          COVERAGE_RATCHET_MODE: ${{ github.event_name == 'pull_request' && 'report' || 'block' }}
        run: |
          python tools/calculate_unified_coverage.py

      - name: Write coverage debug context
        if: ${{ always() }}
        run: |
          mkdir -p coverage
          {
            echo "Coverage Debug Context"
            echo "======================"
            echo "repository=${{ github.repository }}"
            echo "event_name=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo ""
            echo "Toolchain"
            echo "---------"
            python --version
            echo "fan_in_runtime=stdlib_python"
            echo ""
            echo "Coverage Inputs"
            echo "---------------"
            for file in \
              coverage/backend.lcov \
              coverage/frontend.lcov \
              coverage/common.lcov \
              coverage/tools.lcov \
              unified-coverage.json; do
              if [ -f "$file" ]; then
                bytes=$(wc -c < "$file" | tr -d ' ')
                sha=$(shasum -a 256 "$file" | awk '{print $1}')
                echo "$file bytes=$bytes sha256=$sha"
              else
                echo "$file missing"
              fi
            done
          } > coverage/coverage-context.txt

      - name: Upload unified coverage context
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unified-coverage-context
          path: |
            coverage/backend.lcov
            coverage/frontend.lcov
            coverage/common.lcov
            coverage/tools.lcov
            coverage/coverage-context.txt
            unified-coverage.json
          retention-days: 14

      - name: Rehearse unified coverage baseline PR (dry-run)
        run: |
          python tools/open_unified_coverage_baseline_pr.py \
            --coverage-context unified-coverage.json \
            --dry-run

      - name: Rehearse evidence bundle generation (dry-run)
        run: |
          python -m pip install --quiet pyyaml
          python tools/generate_evidence_bundle.py --dry-run

      - name: Build line-only Coveralls LCOV
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python tools/build_unified_lcov.py coverage/coveralls-unified.lcov --strip-branches

      - name: Upload main unified coverage to Coveralls
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: coverage/coveralls-unified.lcov
          flag-name: unified
          base-path: .

  unified-coverage-baseline-pr:
    name: Open Unified Coverage Baseline PR
    needs: [changes, unified-coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.pr_required == 'true' && needs.unified-coverage.result == 'success'
    # Best-effort post-merge automation: opening/refreshing the baseline PR must
    # never fail the main CI run. Isolated with continue-on-error on the execution step.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download unified coverage context
        uses: actions/download-artifact@v8
        with:
          name: unified-coverage-context
          path: coverage-context

      # Main pushes open/update a reviewed baseline PR when the measured baseline rises.
      - name: Open unified coverage baseline PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_BRANCH: automation/unified-coverage-baseline
        run: |
          python tools/open_unified_coverage_baseline_pr.py \
            --coverage-context coverage-context/unified-coverage.json

  ac-traceability:
    name: AC Traceability Check
    needs: [changes, lint, tooling-coverage-merge, backend, backend-integration, backend-e2e-tier1, frontend-vitest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: ./.github/actions/setup-uv-retry
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download DDD detector observations
        if: needs.changes.outputs.pr_required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ddd-governance-observations
          path: governance-inputs/ddd

      - name: Download backend JUnit evidence
        if: needs.changes.outputs.pr_required == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: backend-*test-context
          path: governance-inputs/junit/backend

      - name: Download frontend JUnit evidence
        if: needs.changes.outputs.pr_required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: frontend-vitest-test-context
          path: governance-inputs/junit/frontend

      - name: Download tooling JUnit evidence
        if: needs.changes.outputs.pr_required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: coverage-tooling
          path: governance-inputs/junit/tooling

      - name: Build current package governance observations
        if: needs.changes.outputs.pr_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --with pyyaml --with pydantic python tools/build_package_governance_observations.py \
            --repository "${{ github.repository }}" \
            --target-sha "${{ github.sha }}" \
            --junit-root governance-inputs/junit \
            --detector-payload governance-inputs/ddd/ddd-governance-observations.json \
            --output "$RUNNER_TEMP/PACKAGE-GOVERNANCE-OBSERVATIONS.json" \
            --raw-github-out "$RUNNER_TEMP/PACKAGE-GOVERNANCE-GITHUB.json"

      - name: AC Traceability Check
        run: |
          set +e
          uv run --with pyyaml python tools/generate_ac_registry.py --check
          registry_status=$?
          # NOTE: the AC-index gate is exactly TWO gates and runs ONCE, in the
          # fast `lint` job (`tools/check_ac_index.py`). Its Gate A INTEGRITY now
          # FOLDS the former standalone `check_ac_traceability` (CI-stage
          # traceability classifications) and `check_critical_proof_matrix`
          # (per-proof trust/mirror/marker + macro-outcome contract) by calling
          # those modules as libraries — so they are no longer separate CI gate
          # STEPS here (no protection lost, no double-run of the index gate).
          uv run --with pyyaml python tools/check_e2e_epic_traceability.py --output "$RUNNER_TEMP/E2E-EPIC-TRACEABILITY.md"
          e2e_status=$?
          uv run --with pyyaml python tools/build_ac_traceability.py --output "$RUNNER_TEMP/AC-TEST-TRACEABILITY-AUDIT.md"
          audit_status=$?
          if [[ "${{ needs.changes.outputs.pr_required }}" == "true" ]]; then
            uv run --with pyyaml --with pydantic python tools/report_package_governance.py \
              --observations "$RUNNER_TEMP/PACKAGE-GOVERNANCE-OBSERVATIONS.json" \
              --expected-target-sha "${{ github.sha }}" \
              --json-out "$RUNNER_TEMP/PACKAGE-GOVERNANCE.json" \
              --markdown-out "$RUNNER_TEMP/PACKAGE-GOVERNANCE.md"
            governance_projection_status=$?
          else
            governance_projection_status=0
          fi
          mkdir -p "$RUNNER_TEMP/reconciliation-audit"
          (
            cd apps/backend
            uv run python ../../tools/reconciliation_audit.py \
              --output-dir "$RUNNER_TEMP/reconciliation-audit"
          )
          reconciliation_audit_status=$?
          set -e

          {
            echo "AC Traceability Context"
            echo "======================="
            echo "repository=${{ github.repository }}"
            echo "event_name=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo ""
            echo "Gate Status"
            echo "-----------"
            echo "generate_ac_registry=$registry_status"
            echo "check_e2e_epic_traceability=$e2e_status"
            echo "build_ac_traceability=$audit_status"
            echo "package_governance_projection=$governance_projection_status"
            echo "reconciliation_audit_gate=$reconciliation_audit_status"
            echo ""
            echo "NOTE: CI-stage traceability + critical-proof-matrix contracts are"
            echo "now folded into the single check_ac_index gate (lint job)."
          } > "$RUNNER_TEMP/AC-TRACEABILITY-CONTEXT.md"

          if [ "$registry_status" -ne 0 ] || [ "$e2e_status" -ne 0 ] || [ "$audit_status" -ne 0 ] || [ "$governance_projection_status" -ne 0 ] || [ "$reconciliation_audit_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload AC traceability audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ac-test-traceability-audit
          path: |
            ${{ runner.temp }}/AC-TEST-TRACEABILITY-AUDIT.md
            ${{ runner.temp }}/E2E-EPIC-TRACEABILITY.md
            ${{ runner.temp }}/AC-TRACEABILITY-CONTEXT.md
            ${{ runner.temp }}/PACKAGE-GOVERNANCE.json
            ${{ runner.temp }}/PACKAGE-GOVERNANCE.md
            ${{ runner.temp }}/PACKAGE-GOVERNANCE-OBSERVATIONS.json
            ${{ runner.temp }}/PACKAGE-GOVERNANCE-GITHUB.json
            ${{ runner.temp }}/reconciliation-audit/reconciliation-audit.json
            ${{ runner.temp }}/reconciliation-audit/reconciliation-audit.md
          retention-days: 14

  ac-behavioral-ratchet:
    name: AC Behavioral Score Ratchet
    # Wait for every test stage that emits junit (incl. frontend Vitest) so the aggregate is
    # complete and cannot race an in-flight upload.
    needs: [changes, backend, backend-integration, backend-e2e-tier1, frontend-vitest]
    if: needs.changes.outputs.pr_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download backend shard junit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: backend-shard-*-test-context
          path: junit-artifacts

      - name: Download backend integration junit artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-integration-test-context
          path: junit-artifacts/backend-integration-test-context

      - name: Download backend Tier-1 junit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: backend-tier1-e2e-*-test-context
          path: junit-artifacts

      - name: Download frontend Vitest junit artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-vitest-test-context
          path: junit-artifacts/frontend-vitest-test-context

      - name: Aggregate AC behavioral evidence and ratchet against baseline
        run: |
          # Collect every junit-xml emitted by the test stages (shards, integration, tier-1).
          junit_files=$(find junit-artifacts -name '*.xml' -print)
          if [ -z "$junit_files" ]; then
            echo "No junit-xml artifacts found — cannot evaluate AC behavioral evidence." >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          python tools/aggregate_ac_evidence.py $junit_files --output ac-evidence-current.json
          # L2 (pass-required) + L3 (score ratchet) against the checked-in baseline.
          python tools/check_ac_score_baseline.py ac-evidence-current.json
          # ci_tier reconciliation (#1557): every behavioral pr_ci proof must
          # actually appear in this PR's junit evidence — declared execution
          # tier is a contract, not metadata. The proof graph loads the AC
          # registry, which needs PyYAML (this job is bare setup-python).
          python -m pip install --quiet pyyaml
          # shellcheck disable=SC2086
          python tools/check_pr_ci_evidence.py $junit_files

  evidence-bundle:
    name: Generate Evidence Bundle
    needs: [changes, unified-coverage, ac-behavioral-ratchet]
    # #1690: main-branch-only, informational (not a required check — no gate
    # depends on this job, so it cannot block a merge or grow the required-check
    # count). Runs after the two gates whose output it aggregates.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate evidence bundle
        continue-on-error: true
        run: |
          # ac_tier_water_line() -> check_ac_tier_baseline -> generate_ac_registry
          # -> ac_registry_format needs PyYAML; this job is bare setup-python
          # (matches the ac-behavioral-ratchet job's same gotcha above).
          python -m pip install --quiet pyyaml
          python tools/generate_evidence_bundle.py \
            --output evidence-bundle.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --gate-results '{"unified-coverage": "${{ needs.unified-coverage.result }}", "ac-behavioral-ratchet": "${{ needs.ac-behavioral-ratchet.result }}"}'

      - uses: actions/upload-artifact@v7
        with:
          name: evidence-bundle
          path: evidence-bundle.json
          retention-days: 90

  finish:
    needs: [changes, schema-migrations, backend, backend-integration, backend-e2e-tier1, frontend-build, frontend-vitest, frontend-playwright, frontend-telemetry-e2e, container-images, verify-sha-image-published, lint, tooling-coverage-merge, unified-coverage, ac-traceability, ac-behavioral-ratchet]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The finish job's merge authority is the "Check job status" step alone. The
      # three summary steps below are non-gating reporting and all carry
      # continue-on-error so a step-summary write can never fail the merge gate.
      # Orphan enforcement only makes sense when the backend suites actually ran:
      # on lightweight (docs/ci-only) pushes the heavy jobs are skipped, no
      # served-manifest artifacts exist, and every non-truth-paired cassette
      # would read as a false orphan (seen on main 8cdfde41: served=0, orphans=5).
      - name: Download backend test contexts (cassette orphan gate)
        if: ${{ needs.backend.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: "backend-*test-context"
          path: cassette-usage
      - name: Cassette orphan gate
        if: ${{ needs.backend.result == 'success' }}
        run: |
          # #1596 AC-llm.10.6 / #1597: every committed cassette must be JUSTIFIED —
          # either SERVED by at least one backend test job, or paired with a
          # ground_truth/*.truth.json (the graded-eval corpus consumes those by
          # truth-file iteration in the root tooling lane, which uploads no
          # served-manifest). An unjustified cassette is a changed-prompt leftover
          # (the fingerprint moved; the old frozen response can never be reached
          # again). Fails loudly instead of letting dead fixtures accumulate.
          python3 - <<'PY'
          from pathlib import Path

          cassette_dir = Path("common/testing/fixtures/llm_cassettes")
          committed = {p.stem for p in cassette_dir.glob("*.json")}
          truth_paired = {
              p.name.removesuffix(".truth.json")
              for p in (cassette_dir / "ground_truth").glob("*.truth.json")
          }
          served = set()
          for f in Path("cassette-usage").rglob("served-cassettes*.txt"):
              served |= {line.strip() for line in f.read_text().splitlines() if line.strip()}
          orphans = sorted(committed - served - truth_paired)
          print(
              f"committed={len(committed)} served={len(served & committed)} "
              f"truth_paired={len(truth_paired)} orphans={len(orphans)}"
          )
          if orphans:
              print("ORPHANED cassettes (no backend job served them — changed-prompt leftovers):")
              for o in orphans:
                  print(f"  common/testing/fixtures/llm_cassettes/{o}.json")
              raise SystemExit(1)
          PY

      - name: Write Coverage-Effect Stage Summary
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cat << "EOF" >> "$GITHUB_STEP_SUMMARY"
          ## CI Stage Coverage Effects

          | Stage | Coverage Effect | Behavior Proof |
          |---|---|---|
          | schema-migrations | not included in unified coverage | yes (Alembic DDL/schema drift) |
          | backend (8-way shard) | contributes to unified line coverage baseline | yes |
          | backend-integration | not included in unified coverage | yes (marker 'integration') |
          | backend-e2e-tier1 | not included in unified coverage | yes (marker 'e2e') |
          | frontend-build | not included in unified coverage | yes (typecheck + production build) |
          | frontend-vitest | contributes to unified line coverage baseline | yes |
          | frontend-playwright | not included in unified coverage | yes (provider-free browser UI) |
          | frontend-telemetry-e2e | not included in unified coverage | yes (browser telemetry emission) |
          | tooling-coverage | contributes common/tools to unified line coverage baseline | yes (tooling contracts) |
          EOF

      - name: Write CI timing summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/github_workflow_timing_summary.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --title "CI Timing Summary" \
            --summary-path "$GITHUB_STEP_SUMMARY"

      - name: Write coverage gate summary
        if: ${{ always() }}
        continue-on-error: true
        run: |
          {
            echo "## Coverage Gate"
            echo ""
            echo "- Authoritative coverage gate: \`Calculate Unified Coverage\` plus \`finish\` — PRs block on diff coverage of changed lines (#1810); main pushes block on the component ratchet."
            echo "- Pull requests do not publish Coveralls status contexts; main pushes upload unified line coverage for badge/trend reporting only."
            echo "- Merge readiness follows \`finish\`; PRs gate on \`tools/check_diff_coverage.py\`, main pushes on the committed \`unified-coverage.json\` baseline."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check job status
        run: |
          echo "Change Classification: ${{ needs.changes.result }}"
          echo "PR Env Required: ${{ needs.changes.outputs.pr_required }}"
          echo "PR Env Reason: ${{ needs.changes.outputs.pr_reason }}"
          echo "Schema Migrations: ${{ needs.schema-migrations.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Frontend Vitest: ${{ needs.frontend-vitest.result }}"
          echo "Frontend Playwright: ${{ needs.frontend-playwright.result }}"
          echo "Frontend Telemetry E2E: ${{ needs.frontend-telemetry-e2e.result }}"
          echo "Staging Images: ${{ needs.container-images.result }}"
          echo "Verify Commit Image Published: ${{ needs.verify-sha-image-published.result }}"
          echo "Tooling/Common Coverage: ${{ needs.tooling-coverage-merge.result }}"
          echo "Unified Coverage: ${{ needs.unified-coverage.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "AC Traceability: ${{ needs.ac-traceability.result }}"
          echo "AC Behavioral Ratchet: ${{ needs.ac-behavioral-ratchet.result }}"
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::Change classification failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::Lint failed"
            exit 1
          fi
          if [[ "${{ needs.ac-traceability.result }}" != "success" ]]; then
            echo "::error::AC traceability check failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.pr_required }}" == "true" ]]; then
            if [[ "${{ needs.schema-migrations.result }}" != "success" ]]; then
              echo "::error::Schema migration contract failed"
              exit 1
            fi
            if [[ "${{ needs.backend.result }}" != "success" ]]; then
              echo "::error::Backend tests failed"
              exit 1
            fi
            if [[ "${{ needs.backend-integration.result }}" != "success" ]]; then
              echo "::error::Backend integration tests failed"
              exit 1
            fi
            if [[ "${{ needs.backend-e2e-tier1.result }}" != "success" ]]; then
              echo "::error::Backend Tier-1 API E2E tests failed"
              exit 1
            fi
            # AC-testing.ci-structure.11: frontend-build is right-moved off PRs
            # that touch no apps/frontend/** path (frontend_changed=false),
            # which is a pass, not a gap — mirrors frontend-telemetry-e2e's
            # skip-is-a-pass clause below.
            if [[ "${{ needs.frontend-build.result }}" != "success" && "${{ needs.frontend-build.result }}" != "skipped" ]]; then
              echo "::error::Frontend build/typecheck failed"
              exit 1
            fi
            if [[ "${{ needs.frontend-vitest.result }}" != "success" ]]; then
              echo "::error::Frontend Vitest coverage failed"
              exit 1
            fi
            # AC-testing.ci-structure.11: frontend-playwright is right-moved
            # the same way as frontend-build above.
            if [[ "${{ needs.frontend-playwright.result }}" != "success" && "${{ needs.frontend-playwright.result }}" != "skipped" ]]; then
              echo "::error::Frontend Playwright failed"
              exit 1
            fi
            # #1689: frontend-telemetry-e2e is right-moved off PRs that touch no
            # apps/frontend/** path (frontend_changed=false), which is a pass,
            # not a gap — mirrors container-images' skip-is-a-pass clause below.
            if [[ "${{ needs.frontend-telemetry-e2e.result }}" != "success" && "${{ needs.frontend-telemetry-e2e.result }}" != "skipped" ]]; then
              echo "::error::Frontend telemetry E2E failed"
              exit 1
            fi
            if [[ "${{ needs.tooling-coverage-merge.result }}" != "success" ]]; then
              echo "::error::Tooling/common coverage failed"
              exit 1
            fi
            if [[ "${{ needs.unified-coverage.result }}" != "success" ]]; then
              echo "::error::Unified coverage check failed"
              exit 1
            fi
            if [[ "${{ needs.ac-behavioral-ratchet.result }}" != "success" ]]; then
              echo "::error::AC behavioral-score ratchet failed"
              exit 1
            fi
            # container-images is right-moved: it is skipped when the build context
            # did not change (image_build_required=false), which is a pass, not a gap.
            if [[ "${{ needs.container-images.result }}" != "success" && "${{ needs.container-images.result }}" != "skipped" ]]; then
              echo "::error::Container image validation failed"
              exit 1
            fi
            # verify-sha-image-published only runs on main push (see its own if:) —
            # skipped on PRs and non-main pushes, which is a pass, not a gap.
            if [[ "${{ needs.verify-sha-image-published.result }}" != "success" && "${{ needs.verify-sha-image-published.result }}" != "skipped" ]]; then
              echo "::error::Commit image publication verification failed"
              exit 1
            fi
          else
            echo "Heavy backend/frontend/coverage jobs skipped for lightweight changes."
          fi
          echo "✅ All checks passed!"
