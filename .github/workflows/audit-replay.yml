# AI/OCR Audit Replay (weekly schedule, manual dispatch, post-deploy dispatch)
#
# Issue #1232 (AC8.13.157): the heavy provider-backed LLM audit journeys (full
# statement journey, four-asset net-worth golden path, personal financial report
# package, CSV/traceability) are NOT part of the production-promotion blocking
# path. The blocking deploy path runs only the minimal AI/OCR canary
# (deploy.yml#ai-ocr-gate, corpus: canary). This workflow is their separate home.
#
# #2370 (owner direction: heavy board, light gates):
#   - corpus audit_replay runs weekly (schedule) and on manual dispatch.
#   - corpus core_journey runs after each staging deploy: deploy.yml dispatches
#     it, and the deploy run does not wait for it.
#   - Red means red: a failed replay fails this run. Nothing depends on this
#     workflow, so its red blocks no deploy and no release. The journey board
#     (journey-board.yml) publishes every run.
#
# It calls the SAME reusable gate body (staging-ai-ocr-gate.yml) as the deploy
# path and the manual recovery gate (single owner, AC8.13.153).
name: AI/OCR Audit Replay
run-name: AI/OCR Audit Replay (${{ inputs.corpus || 'audit_replay' }})

on:
  schedule:
    # Weekly comprehensive replay (owner instruction 2026-10-12, #2370).
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      corpus:
        description: "audit_replay (comprehensive journeys) or core_journey (journey-board proofs)"
        required: false
        default: audit_replay
        type: choice
        options:
          - audit_replay
          - core_journey
      version_ref:
        description: "Optional deployed version_ref / SHA to replay against (defaults to the live staging /api/health git_sha)"
        required: false
        type: string

concurrency:
  # One run per corpus at a time; never cancel an in-flight provider-backed run.
  # A group keeps one pending run, so the corpora use separate groups: a
  # post-deploy core_journey dispatch must not drop a pending weekly replay.
  group: ai-ocr-audit-replay-${{ inputs.corpus || 'audit_replay' }}
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve staging replay target
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit_ref: ${{ steps.target.outputs.commit_ref }}
      expected_sha: ${{ steps.target.outputs.expected_sha }}
    steps:
      - name: Resolve replay target from staging health
        id: target
        env:
          STAGING_HEALTH_URL: https://report-staging.zitian.party/api/health
          INPUT_VERSION_REF: ${{ inputs.version_ref }}
        run: |
          set -euo pipefail
          # Manual dispatch may pin a version_ref; otherwise replay against the
          # version currently live on staging (read from /api/health git_sha).
          expected_sha="${INPUT_VERSION_REF:-}"
          if [ -z "$expected_sha" ]; then
            response="$(curl -fsS --max-time 15 "$STAGING_HEALTH_URL" || true)"
            expected_sha="$(
              RESPONSE="$response" python3 - <<'PY'
          import json
          import os

          payload = os.environ.get("RESPONSE", "")
          try:
              data = json.loads(payload) if payload else {}
          except json.JSONDecodeError:
              data = {}
          print(data.get("git_sha") or data.get("version") or "")
          PY
            )"
          fi
          # commit_ref selects the corpus code to run; checking out the deployed
          # SHA keeps the audit tests aligned with the live staging code. Fall
          # back to the workflow ref when staging health is unreachable.
          commit_ref="${expected_sha:-${{ github.sha }}}"
          {
            echo "commit_ref=${commit_ref}"
            echo "expected_sha=${expected_sha}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## AI/OCR Audit Replay Target"
            echo ""
            echo "- Health URL: ${STAGING_HEALTH_URL}"
            echo "- Resolved expected_sha: \`${expected_sha:-unknown}\`"
            echo "- Checkout commit_ref: \`${commit_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  audit-replay:
    name: AI/OCR Audit Replay
    permissions:
      contents: read
      issues: write
    needs: [resolve-target]
    # Nothing depends on this job, so its red never blocks production
    # promotion (AC8.13.157). The single gate body lives in the reusable
    # workflow (AC8.13.153). A schedule event has no inputs: it runs audit_replay.
    uses: ./.github/workflows/staging-ai-ocr-gate.yml
    with:
      commit_ref: ${{ needs.resolve-target.outputs.commit_ref }}
      expected_sha: ${{ needs.resolve-target.outputs.expected_sha }}
      corpus: ${{ inputs.corpus || 'audit_replay' }}
    secrets: inherit

  evidence-bundle:
    name: Generate Evidence Bundle
    runs-on: ubuntu-24.04
    needs: [audit-replay]
    # #1690: this producer runs regardless of the audit-replay outcome (a red
    # replay fails its run but blocks nothing, AC8.13.157), since a regression
    # IS itself evidence worth bundling.
    if: always()
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"

      - name: Generate evidence bundle
        env:
          PROVIDER_STATUS: ${{ needs.audit-replay.outputs.ai_ocr_status }}
          PROVIDER_EXIT_CODE: ${{ needs.audit-replay.outputs.ai_ocr_exit_code }}
        run: |
          # ac_tier_water_line() -> check_ac_tier_baseline -> generate_ac_registry
          # needs PyYAML; this job is bare setup-python.
          python -m pip install --quiet pyyaml
          python tools/generate_evidence_bundle.py \
            --output evidence-bundle.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --gate-results "{\"audit-replay\": \"${PROVIDER_STATUS}\"}" \
            --provider-status "$PROVIDER_STATUS" \
            --provider-exit-code "$PROVIDER_EXIT_CODE"

      - uses: actions/upload-artifact@v7
        with:
          name: evidence-bundle
          path: evidence-bundle.json
          retention-days: 90
