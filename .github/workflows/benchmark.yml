# Financial Temporal Benchmark Suite
#
# Non-blocking, statistical tracking and quality observatory for multi-period
# financial reporting scenarios (3-statement mathematical reconciliation, zero
# P&L contamination on asset transfers, temporal rollforward continuity).
#
# Produces standalone, lightweight HTML reports (<100KB) and publishes to
# GitHub Pages under /benchmarks/<version>/report.html with an aggregated
# multi-version trendline dashboard at /benchmarks/index.html.
name: Financial Benchmark

on:
  workflow_dispatch:
    inputs:
      version_ref:
        description: "Version reference / release tag (defaults to live staging /api/health version)"
        required: false
        type: string
      app_url:
        description: "Target application URL"
        required: false
        default: "https://report-staging.zitian.party"
        type: string
      case:
        description: "Scenarios to run (comma-separated: 1,2,3,4,5,6 or all)"
        required: false
        default: "all"
        type: string
  workflow_call:
    inputs:
      commit_ref:
        description: "Exact commit ref/SHA being benchmarked"
        required: false
        type: string
      version_ref:
        description: "Version reference / release tag"
        required: false
        type: string
      app_url:
        description: "Target application URL"
        required: false
        default: "https://report-staging.zitian.party"
        type: string

concurrency:
  group: financial-benchmark-${{ inputs.version_ref || github.ref }}
  cancel-in-progress: false

jobs:
  run-benchmark:
    name: Run Financial Benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_ref || github.sha }}
          fetch-depth: 0

      # The E2E toolchain carries the benchmark's Python packages (httpx, reportlab,
      # pyyaml, playwright) and the one cached Playwright install. Pillars 2 and 3
      # (zero console errors, DOM hygiene) need a real browser. Without one the UI
      # case is SKIPPED, and a SKIPPED case fails the run (#2318).
      - name: Set up the E2E toolchain and Playwright browser
        uses: ./.github/actions/setup-e2e-tests

      - name: Resolve target version
        id: target
        env:
          APP_URL: ${{ inputs.app_url || 'https://report-staging.zitian.party' }}
          INPUT_VERSION: ${{ inputs.version_ref }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            response="$(curl -fsS --max-time 15 "${APP_URL}/api/health" || true)"
            version="$(
              RESPONSE="$response" python3 - <<'PY'
          import json, os
          try:
              data = json.loads(os.environ.get("RESPONSE", "{}"))
              print(data.get("git_sha") or data.get("version") or "v2.0")
          except Exception:
              print("v2.0")
          PY
            )"
          fi
          echo "version_ref=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version_ref: $version"

      - name: Sync benchmark fixtures
        run: |
          python tools/sync_benchmark_fixtures.py

      # No continue-on-error: a failed or skipped case must turn this run red. The index
      # and Pages steps below use `if: always()`, so the report is still published.
      - name: Run Financial Scenario Benchmark Suite
        id: benchmark
        env:
          APP_URL: ${{ inputs.app_url || 'https://report-staging.zitian.party' }}
          VERSION_REF: ${{ steps.target.outputs.version_ref }}
          CASE: ${{ inputs.case || 'all' }}
        run: |
          set -uo pipefail
          mkdir -p "docs/benchmarks/${VERSION_REF}"

          python tools/run_financial_scenario_benchmark.py \
            --app-url "$APP_URL" \
            --case "$CASE" \
            --version-ref "$VERSION_REF" \
            --output-html "docs/benchmarks/${VERSION_REF}/report.html" \
            --output-summary "docs/benchmarks/${VERSION_REF}/summary.json" \
            --json-report "docs/benchmarks/${VERSION_REF}/full_report.json"

      # The index lists every published run. docs/benchmarks holds only the runs that main
      # commits plus this run, so the index reads the runs that GitHub Pages holds too (#2513).
      - name: Fetch the published benchmark history
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/published"
          if git fetch --no-tags --depth=1 origin gh-pages \
            && git archive --format=tar FETCH_HEAD benchmarks | tar -x -C "$RUNNER_TEMP/published"; then
            echo "Published runs: $(find "$RUNNER_TEMP/published/benchmarks" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          else
            echo "::warning::The published benchmark history is not available. The index lists only the runs in docs/benchmarks."
          fi

      - name: Update benchmark multi-version index & manifest
        if: always()
        run: |
          python3 tools/generate_benchmark_index.py \
            --benchmarks-dir docs/benchmarks \
            --history-dir "$RUNNER_TEMP/published/benchmarks"

      - name: Deploy Benchmark Observatory to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/benchmarks
          destination_dir: benchmarks
          keep_files: true

      - name: Write Step Summary with Observatory Links
        if: always()
        env:
          VERSION_REF: ${{ steps.target.outputs.version_ref }}
          APP_URL: ${{ inputs.app_url || 'https://report-staging.zitian.party' }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          report_url="https://wangzitian0.github.io/finance_report/benchmarks/${VERSION_REF}/report.html"
          dashboard_url="https://wangzitian0.github.io/finance_report/benchmarks/index.html"
          outcome_badge="❌ Benchmark Suite Failed"
          if [[ "$BENCHMARK_OUTCOME" == "success" ]]; then
            outcome_badge="✅ All Scenarios Passed (Invariants Verified)"
          fi
          {
            echo "## 📊 Financial Reporting Benchmark Results"
            echo ""
            echo "- **Status**: ${outcome_badge}"
            echo "- **Target Environment**: \`${APP_URL}\`"
            echo "- **Evaluated Version**: \`${VERSION_REF}\`"
            echo ""
            echo "### 🔗 Observatory Links"
            echo "- 📄 [View ${VERSION_REF} Detailed Report](${report_url})"
            echo "- 📈 [Open Historical Trendline Dashboard](${dashboard_url})"
          } >> "$GITHUB_STEP_SUMMARY"
