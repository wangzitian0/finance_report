- request:
    body: "{\"model\":\"glm-5.3-flash\",\"stream\":true,\"messages\":[{\"role\":\"user\",\"content\":[{\"text\":\"You
      are a financial statement parser.\\nExtract structured transaction data from
      the provided document.\\n\\nPRIVACY INSTRUCTIONS:\\n- Do NOT extract or include
      any personally identifiable information (PII)\\n- Ignore names, addresses, NRIC/ID
      numbers, and full account numbers\\n- Only extract account_last4: the LAST 4
      alphanumeric characters (letters and digits ONLY) of the account number. Strip
      all hyphens, dashes, spaces, and special characters first, then take the last
      4 characters. Example: \\\"XXX-553-3\\\" \u2192 \\\"5533\\\", \\\"1234-5678\\\"
      \u2192 \\\"5678\\\"\\n- Focus only on financial transaction data\\n\\nCRITICAL:
      Return a SINGLE JSON object (not an array).\\nDo NOT wrap the JSON in markdown
      or code fences.\\nDo NOT include any extra text before or after the JSON.\\nIf
      the document holds several accounts, list the balances of each account as its
      own entry of \\\"balances\\\".\\n\\nOutput format (JSON object - NOT an array):\\n{\\n
      \ \\\"institution\\\": \\\"Bank Name\\\",\\n  \\\"account_last4\\\": \\\"1234\\\",
      \ // MUST be exactly 4 alphanumeric characters (no hyphens/spaces)\\n  \\\"currency\\\":
      \\\"SGD\\\",\\n  \\\"period_start\\\": \\\"2025-01-01\\\",\\n  \\\"period_end\\\":
      \\\"2025-01-31\\\",\\n  \\\"opening_balance\\\": \\\"10000.00\\\",\\n  \\\"closing_balance\\\":
      \\\"12500.00\\\",\\n  \\\"balances\\\": [\\n    {\\\"currency\\\": \\\"SGD\\\",
      \\\"opening\\\": \\\"10000.00\\\", \\\"closing\\\": \\\"12500.00\\\"},\\n    {\\\"currency\\\":
      \\\"USD\\\", \\\"opening\\\": \\\"2000.00\\\", \\\"closing\\\": \\\"3500.00\\\"}\\n
      \ ],\\n  \\\"transactions\\\": [\\n    {\\n      \\\"date\\\": \\\"2025-01-15\\\",\\n
      \     \\\"description\\\": \\\"SALARY ACME CORP\\\",\\n      \\\"amount\\\":
      \\\"5000.00\\\",\\n      \\\"direction\\\": \\\"IN\\\",\\n      \\\"reference\\\":
      \\\"TXN123456\\\",\\n      \\\"currency\\\": \\\"SGD\\\",\\n      \\\"balance_after\\\":
      \\\"15000.00\\\"\\n    }\\n  ]\\n}\\n\\nImportant Rules:\\n1. Output MUST be
      a single JSON object starting with `{`, NOT an array `[`, and no markdown\\n2.
      All amounts as non-negative strings with 2 decimal places, no commas (e.g.,
      \\\"10000.00\\\")\\n3. Normalize EVERY date to ISO YYYY-MM-DD, converting from
      whatever format the\\n   source uses \u2014 e.g. 2025\u5E7401\u670815\u65E5
      -> 2025-01-15, 15/01/2025 -> 2025-01-15,\\n   2025/1/5 -> 2025-01-05, 15 Jan
      2025 -> 2025-01-15. Do the conversion yourself;\\n   never echo a non-ISO source
      format.\\n4. direction: \\\"IN\\\" for credits/deposits, \\\"OUT\\\" for debits/withdrawals.
      When the table prints two amount columns (for example Debit and Credit, Withdrawal
      and Deposit, Paid out and Paid in), the column that holds the amount decides
      the direction, not the words of the description.\\n5. Include ALL transactions
      visible in the document. NEVER invent, fabricate, or alter a transaction\\n6.
      If unsure about a field, set it to null but include the transaction\\n7. For
      long statements with 50+ transactions, include all of them - do NOT truncate\\n8.
      For each transaction, include \\\"currency\\\" (ISO 4217 code, e.g. \\\"SGD\\\",
      \\\"USD\\\")\\n9. \\\"balance_after\\\": the running balance that the document
      prints on the row of the transaction (the balance column). Use null when the
      row prints no running balance. NEVER compute it.\\n10. Auto-detect the institution
      name from the document header/logo and return it in the \\\"institution\\\"
      field\\n11. MULTI-SECTION STATEMENTS: a statement may contain more than one
      transaction section (e.g. \\\"SAVINGS - TRANSACTION DETAILS\\\" and \\\"INVESTMENTS
      - TRANSACTION DETAILS\\\"). Extract transactions from EVERY section, but record
      each cash movement EXACTLY ONCE. A transfer or fund purchase/redemption between
      the user's own accounts (e.g. \\\"Buy - Mari Invest\\\" / \\\"Sell - Mari Invest\\\")
      is shown as a cash movement in one section AND mirrored in another - include
      ONLY the single cash leg that moves THIS statement's balance (a purchase/\\\"Buy\\\"
      reduces cash -> OUT; a redemption/\\\"Sell\\\" adds cash -> IN), and do NOT
      also add the mirrored row from the other section as a second transaction. Do
      NOT skip transfers between the user's own accounts, and do NOT double-count
      them.\\n12. opening_balance, closing_balance and each \\\"opening\\\" / \\\"closing\\\"
      of \\\"balances\\\": report a value ONLY when the document explicitly prints
      it; otherwise null. NEVER derive, compute, or adjust a balance from the transactions.\\n13.
      FOREIGN-EXCHANGE / CROSS-CURRENCY: if a line converts one currency to another
      (e.g. \\\"Converted 1,000 SGD to 740 USD\\\"), record the leg in the currency
      that actually moved on THIS statement and set its \\\"currency\\\" accordingly;
      preserve the other currency, the exchange rate, and any fee/spread in \\\"description\\\"
      (and \\\"reference\\\" if shown). List a separately-shown fee as its own transaction.\\n14.
      MULTI-CURRENCY STATEMENTS (\\\"balances\\\" array): if the statement holds balances
      in MORE THAN ONE currency (e.g. a multi-currency / consolidated account that
      prints a per-currency or per-account opening & closing, or a \\\"Currency Breakdown\\\"),
      additionally emit a \\\"balances\\\" array with one {currency, opening, closing}
      entry PER currency \u2014 each currency's own opening and closing as shown,
      NEVER cross-summed or converted into a single currency. Put each currency's
      native amounts (do NOT convert to the \\\"base/SGD equivalent\\\" column). The
      top-level \\\"currency\\\"/\\\"opening_balance\\\"/\\\"closing_balance\\\" remain
      the PRIMARY currency's values. OMIT \\\"balances\\\" entirely for an ordinary
      single-currency statement.\\n\",\"type\":\"text\"},{\"text\":\"[Page 1]\\nACME
      Bank Statement\\nAccount: 1234-5678\\nOpening balance: 1000.00\\nDate      Description
      \   Amount\\n-        Salary credit   +2000.00\\n-       Rent payment    -1200.00\\nClosing
      balance: 1800.00\",\"type\":\"text\"}]}],\"stream_options\":{\"include_usage\":true},\"temperature\":0.0,\"do_sample\":false,\"max_tokens\":32768,\"thinking\":{\"type\":\"enabled\",\"clear_thinking\":false},\"reasoning_effort\":\"low\"}"
