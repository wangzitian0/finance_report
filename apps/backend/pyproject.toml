[project]
name = "finance-report-backend"
version = "0.1.0"
description = "Finance Report Backend - FastAPI + SQLAlchemy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "aioboto3>=13.0.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.1",
    "psycopg2-binary>=2.9.9",
    "structlog>=25.5.0",
    "pyjwt>=2.10.1",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "bcrypt==4.0.1",
    "pymupdf>=1.24.0",
    # EPIC-019: a base dependency, not an optional extra — the repo's
    # promote-not-rebuild release model ships ONE image to every environment,
    # and that same image now runs both roles: the API (submits flow runs when
    # PREFECT_API_URL is set) and the durable-parse worker (executes them).
    # CI/local/preview still run in-process (no PREFECT_API_URL => fail-soft
    # fallback in statement_pipeline.py), so installing the client there is
    # inert, not wasted: it's the same image either way.
    # Direct runtime import in RateLimiter and RedisCheck (`redis.asyncio`).
    "redis>=5.0.0",
    "prefect>=3.7.0",
    # A real runtime import (main.py, adapters.py, storage.py, worker_telemetry.py),
    # not test/dev-only, so it belongs in [project.dependencies]: the Docker image
    # builds with `uv sync --frozen --no-dev`, which would otherwise exclude it
    # entirely and crash the app on import at container startup.
    # The `otel` extra installs `opentelemetry-instrumentation-logging` so
    # `infra2_sdk.fastapi.init_service` and `infra2_sdk.runtime.otel.init_worker`
    # own OTel traces/metrics/logs, JSON logging, /livez, /readyz, and /health.
    # The `pydantic-ai` extra installs `pydantic-ai-slim[zai]`: `create_llm_agent` is the one model entry point (#3153).
    "infra2-sdk[otel,pydantic-ai] @ https://github.com/wangzitian0/infra2-sdk/releases/download/v4.6.0/infra2_sdk-4.6.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "moto[s3]>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-split>=0.8.0",
    "pytest-timeout>=2.3.1",
    # Replay of recorded model calls: `pytest --record-mode=none|rewrite` (#3153).
    "pytest-recording>=0.15,<1",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "pdfplumber>=0.11.0",
    "reportlab>=4.0.0",
    "factory-boy>=3.3.0",
    "faker>=33.0.0",
    "locust>=2.20.0",
    "freezegun>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# BLE: a blind `except Exception` must re-raise, or carry a `noqa: BLE001` with the reason (#2964).
select = ["E", "F", "I", "UP", "BLE"]
ignore = [
    "E501",  # Line too long - handled by formatter, 120 is reasonable
    "E401",
    "E402",
    "E701",
    "E702",
    "E714",
    "E731",
    "I001",
    "UP034",
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "BLE001"]
# The work list of BLE001: the files that still hold a blind catch without a reason. `src/llm` and
# `src/reconciliation` are clean. Remove an entry when its file is clean; add none (#2964).
"src/advisor/extension/service.py" = ["BLE001"]
"src/boot.py" = ["BLE001"]
"src/extraction/extension/_media.py" = ["BLE001"]
"src/extraction/extension/deduplication.py" = ["BLE001"]
"src/extraction/extension/pdf_text_layer.py" = ["BLE001"]
"src/extraction/extension/review_queue.py" = ["BLE001"]
"src/extraction/extension/statement_parsing.py" = ["BLE001"]
"src/extraction/extension/statement_parsing_supervisor.py" = ["BLE001"]
"src/extraction/extension/statement_posting.py" = ["BLE001"]
"src/extraction/extension/statement_workflow.py" = ["BLE001"]
"src/main.py" = ["BLE001"]
"src/observability/runtime.py" = ["BLE001"]
"src/observability/telemetry_metrics.py" = ["BLE001"]
"src/observability/worker_telemetry.py" = ["BLE001"]
"src/platform/extension/relay.py" = ["BLE001"]
"src/reporting/extension/income_statement.py" = ["BLE001"]
"src/routers/chat.py" = ["BLE001"]

[tool.ruff.format]
exclude = ["src/**", "tests/**"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: Long-running tests (>1s)",
    "perf: Performance tests",
    "integration: Backend cross-module integration tests with infrastructure and service boundaries",
    "e2e: End-to-end tests, including backend API scenarios and browser UI flows",
    "no_db: Pure tests that must not initialize the autouse database fixture",
    "db: Tests requiring database access",
    "vcr: Tests replaying recorded HTTP cassettes via pytest-recording",
]

# A test that never returns must fail by name inside the PR budget, not at the 15-minute
# job timeout (#2398). On a green run (38359010909) the slowest of 3800 tests took 8.77 s.
# The thread method ends a worker that is blocked outside the event loop.
timeout = 60
timeout_method = "thread"
# In an xdist worker the stack dump of pytest-timeout goes to stdout, which execnet sends to
# /dev/null, so the job log has no stack. faulthandler writes every thread's stack to the real
# stderr of the worker 15 s before the timeout ends it (#2398).
faulthandler_timeout = 45

# Default: run non-slow, non-perf, non-e2e, non-integration tests in a single process without coverage.
# Pass explicit -n auto/4 and --cov flags for CI shards and full coverage verification.
addopts = [
    "-v",
    "-ra",
    "-m", "not e2e and not slow and not perf and not integration",
]

[tool.coverage.run]
# Deny-list approach: source=["src"] makes coverage.py consider backend src.
source = ["src"]
# Required: greenlet+thread tracer for async (Py3.12 sys.monitoring drops events otherwise);
# parallel+sigterm let pytest-xdist workers write per-worker .coverage.* and flush on SIGTERM.
concurrency = ["greenlet", "thread"]
parallel = true
sigterm = true
omit = [
    "__init__.py",
    "schemas/__init__.py",
    "routers/__init__.py",
    "tests/**",
    "migrations/**",
]
